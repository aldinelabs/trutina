<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>trutina-4b charts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Palette: Aldine brand surface (#F3F3F1 / #1D1D16) with Pine's olive neutrals (oklch hue ~107).
   trutina is always the darkest ink; everything else steps down in lightness. */
:root {
  --bg: #f3f3f1;
  --card: #ffffff;
  --fg: #1d1d16;
  --ink-2: oklch(0.394 0.023 107.4);
  --muted: oklch(0.58 0.031 107.3);
  --faint: oklch(0.737 0.021 106.9);
  --pale: oklch(0.88 0.011 106.6);
  --border: oklch(0.93 0.007 106.5);
  --grid: oklch(0.955 0.005 106.5);
  --sans: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1; }
.frame { width: 1600px; height: 1000px; padding: 56px 64px 44px; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; align-items: center; justify-content: space-between; }
header img { height: 40px; display: block; }
header .tag { font: 500 15px/1 var(--mono); color: var(--muted); letter-spacing: .02em; display: flex; gap: 10px; align-items: center; }
header .tag b { color: var(--fg); font-weight: 500; }
header .pill { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 14px; }
.titles h1 { margin: 0; font-size: 46px; line-height: 1.08; font-weight: 600; letter-spacing: -0.025em; max-width: 1300px; }
.titles p { margin: 12px 0 0; font-size: 20px; line-height: 1.45; color: var(--muted); max-width: 1300px; }
.card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px;
  box-shadow: 0 1px 3px 0 oklch(0 0 0 / .05); min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 24px; flex: 1; min-height: 0; }
.row > .card { flex: 1; }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.card h2 span { color: var(--muted); font-weight: 400; }
svg { display: block; overflow: visible; }
svg text { font-family: var(--sans); }
.axis { fill: var(--muted); font-size: 14px; }
.axis-title { fill: var(--muted); font-size: 14px; font-weight: 500; }
.lbl { fill: var(--ink-2); font-size: 14px; }
.lbl-us { fill: var(--fg); font-size: 17px; font-weight: 700; }
.lbl-sub { fill: var(--muted); font-size: 13px; }
.val { fill: var(--fg); font-size: 15px; font-weight: 600; }
.val-muted { fill: var(--muted); font-size: 15px; font-weight: 500; }
footer { font-size: 13.5px; line-height: 1.5; color: var(--muted); display: flex; justify-content: space-between; gap: 40px; }
footer .src { max-width: 1250px; }
footer .site { font-family: var(--mono); white-space: nowrap; color: var(--ink-2); }
.legend { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 8px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px; }
.kpi .k { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.kpi .v small { font-size: 22px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.kpi .f { font-size: 14.5px; color: var(--ink-2); line-height: 1.4; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script src="data.js"></script>
<script>
const D = window.DATA, T = D.trutina;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);

function frame({ title, sub, body, src }) {
  return `<header><img src="brand/aldine-tm.svg" alt="Aldine">
    <div class="tag"><span class="pill"><b>trutina-4b</b> · typed decision model</span></div></header>
    <div class="titles"><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>
    ${body}
    <footer><div class="src">${src}</div><div class="site">huggingface.co/aldinelabs/trutina-4b</div></footer>`;
}

/* ---------- small SVG helpers ---------- */
function linScale(d0, d1, r0, r1) { return v => r0 + (v - d0) / (d1 - d0) * (r1 - r0); }
function logScale(d0, d1, r0, r1) { const a = Math.log10(d0), b = Math.log10(d1); return v => r0 + (Math.log10(v) - a) / (b - a) * (r1 - r0); }
const svgTag = (w, h) => `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%; flex:1; min-height:0">`;
const usDot = (x, y, r = 9) => `<circle cx="${x}" cy="${y}" r="${r + 7}" fill="var(--fg)" opacity=".08"/><circle cx="${x}" cy="${y}" r="${r}" fill="var(--fg)" stroke="var(--card)" stroke-width="2.5"/>`;

/* ---------- 1. Pareto: accuracy vs latency ---------- */
function pareto() {
  const W = 1470, H = 520, m = { l: 70, r: 30, t: 20, b: 56 };
  const rows = D.jevbench.rows.filter(r => r.kind !== "cpu" && r.i_open >= 45 && r.p50_ms >= 10);
  const us = { name: "trutina-4b", i_open: T.i_open, p50_ms: T.latency_rtxpro6000.full.p50, us: true, hw: "RTX PRO 6000", params_b: 4 };
  const all = [...rows, us];
  const x = logScale(10, 10000, m.l, W - m.r), y = linScale(45, 100, H - m.b, m.t);
  // Pareto frontier: lower latency and higher Intelligence are both better
  const sorted = [...all].sort((a, b) => a.p50_ms - b.p50_ms);
  const front = []; let best = -1;
  for (const r of sorted) if (r.i_open > best) { front.push(r); best = r.i_open; }
  let g = "";
  for (const t of [50, 60, 70, 80, 90, 100]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="axis" x="${m.l - 14}" y="${y(t) + 5}" text-anchor="end">${t}</text>`;
  for (const t of [10, 30, 100, 300, 1000, 3000, 10000]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - m.b + 26}" text-anchor="middle">${t >= 1000 ? t / 1000 + " s" : t + " ms"}</text>`;
  g += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">p50 latency per decision (log scale) →  faster is left</text>`;
  g += `<text class="axis-title" transform="translate(16 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">JevBench open-set Intelligence ↑</text>`;
  // shaded "dominated by trutina" region
  g += `<rect x="${x(us.p50_ms)}" y="${y(us.i_open)}" width="${W - m.r - x(us.p50_ms)}" height="${H - m.b - y(us.i_open)}" fill="var(--fg)" opacity=".035"/>`;
  g += `<text class="lbl-sub" x="${W - m.r - 12}" y="${H - m.b - 14}" text-anchor="end">slower and less accurate than trutina-4b</text>`;
  const fp = front.map(r => `${x(r.p50_ms).toFixed(1)},${y(r.i_open).toFixed(1)}`).join(" L");
  g += `<path d="M${fp}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="5 5" opacity=".55"/>`;
  for (const r of rows) {
    const cx = x(r.p50_ms), cy = y(r.i_open);
    g += r.kind === "api"
      ? `<rect x="${cx - 5.5}" y="${cy - 5.5}" width="11" height="11" rx="2" fill="var(--card)" stroke="var(--faint)" stroke-width="2"/>`
      : `<circle cx="${cx}" cy="${cy}" r="6" fill="${r.params_b === 4 ? "var(--muted)" : "var(--pale)"}" stroke="${r.params_b === 4 ? "var(--card)" : "var(--faint)"}" stroke-width="1.5"/>`;
  }
  g += usDot(x(us.p50_ms), y(us.i_open), 10);
  const lab = {  // [dx, dy, anchor]
    "JevK5 v0.3": [-10, -12, "end"], "Plumb-4B": [0, 26, "middle"], "decider-4b v2": [12, 20, "start"],
    "Cygnet": [0, -16, "middle"], "djev": [10, 20, "start"], "Eikos-27B": [10, -12, "start"],
    "AutoJev-27B (RTX PRO 6000)": [12, 22, "start"], "Surogate Rune 26B-A4B v3 (RTX PRO 6000)": [12, 20, "start"],
    "Jev 1.13.0": [12, 18, "start"], "GPT-6 Luna (medium effort)": [-12, -12, "end"], "OpenJev (thinking)": [-12, -12, "end"],
    "Gemini 3.1 Flash-Lite": [12, 18, "start"], "DeepSeek V4.1 Flash (thinking)": [12, 18, "start"],
    "Open Jev JSON Canvas": [0, -14, "middle"],
  };
  const pretty = n => n.replace(" (RTX PRO 6000)", "").replace(" v3", "");
  for (const r of rows) {
    const L = lab[r.name]; if (!L) continue;
    const size = r.params_b ? ` · ${r.params_b}B` : r.kind === "api" ? " · API" : "";
    g += `<text class="lbl" x="${x(r.p50_ms) + L[0]}" y="${y(r.i_open) + L[1]}" text-anchor="${L[2]}">${esc(pretty(r.name))}<tspan class="lbl-sub">${size}</tspan></text>`;
  }
  g += `<text class="lbl-us" x="${x(us.p50_ms) - 18}" y="${y(us.i_open) - 18}" text-anchor="end">trutina-4b</text>`;
  g += `<text class="lbl-sub" x="${x(us.p50_ms) - 18}" y="${y(us.i_open) + 2}" text-anchor="end">69.0 · 28 ms</text>`;
  const legend = `<div class="legend">
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--fg)"/></svg></i>trutina-4b</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="var(--muted)"/></svg></i>other 4B models</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="var(--pale)" stroke="var(--faint)" stroke-width="1.5"/></svg></i>other self-hosted models</span>
    <span><i><svg width="16" height="16"><rect x="2" y="2" width="12" height="12" rx="2" fill="#fff" stroke="var(--faint)" stroke-width="2"/></svg></i>hosted APIs</span>
    <span><i><svg width="26" height="10"><line x1="0" x2="26" y1="5" y2="5" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/></svg></i>Pareto frontier</span></div>`;
  return frame({
    title: "On the accuracy–latency frontier",
    sub: "No system on the JevBench v1.5.4 board is both faster and more accurate than trutina-4b: everything more accurate is slower, and everything faster is less accurate.",
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: `JevBench v1.5.4 official results: open-set Intelligence and raw p50 latency, measured by the maintainers (one decision per request; H100, RTX 5090, RTX PRO 6000, A6000 pods; hosted APIs end to end). trutina-4b: Intelligence computed by us on the public tasks with the v1.5 formula; latency measured by us on one RTX PRO 6000 through its HTTP server. ${rows.length} systems shown (Intelligence ≥ 45).`,
  });
}

/* ---------- 2. Size: 4B against 12–35B ---------- */
function size() {
  const pick = n => D.jevbench.rows.find(r => r.name === n);
  const big = ["Eikos-27B", "Cygnet", "AutoJev-27B (RTX PRO 6000)", "Jev-Omni", "Surogate Rune 26B-A4B v3 (RTX PRO 6000)", "NInfer Qwen3.8-27B NVFP4", "decider-35b-a3b", "reflex-27b"].map(pick).filter(Boolean);
  const small = ["spark-s1-4b-v6", "decider-4b v2", "JevK5 v0.3", "Plumb-4B", "Malkuth-4B", "Decision 4B v1.2"].map(pick).filter(Boolean);
  const rows = [{ name: "trutina-4b", i_open: T.i_open, params_b: 4, us: true }, ...big, ...small].sort((a, b) => b.i_open - a.i_open);
  const W = 1470, rowH = 38, top = 8, H = rows.length * rowH + top + 30, lx = 330;
  const x = linScale(40, 80, lx, W - 120);
  let g = "";
  for (const t of [40, 50, 60, 70, 80]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 26}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 4}" text-anchor="middle">${t}</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2, w = x(r.i_open) - lx;
    const four = r.params_b === 4;
    const fill = r.us ? "var(--fg)" : four ? "var(--muted)" : "var(--pale)";
    const nm = r.name.replace(" (RTX PRO 6000)", "").replace(" v3", "");
    g += `<text class="${r.us ? "lbl-us" : "lbl"}" x="${lx - 74}" y="${cy + 5}" text-anchor="end" ${r.us ? 'style="font-size:16px"' : ""}>${esc(nm)}</text>`;
    g += `<rect x="${lx - 62}" y="${cy - 12}" width="50" height="24" rx="12" fill="${four ? "var(--fg)" : "var(--card)"}" stroke="${four ? "none" : "var(--pale)"}"/>`;
    g += `<text x="${lx - 37}" y="${cy + 5}" text-anchor="middle" style="font: 600 13px var(--mono); fill:${four ? "#fff" : "var(--ink-2)"}">${r.params_b}B</text>`;
    g += `<rect x="${lx}" y="${cy - 11}" width="${w}" height="22" rx="4" fill="${fill}"/>`;
    g += `<text class="${r.us ? "val" : "val-muted"}" x="${lx + w + 10}" y="${cy + 5}">${fmt1(r.i_open)}</text>`;
  });
  return frame({
    title: "A 4B model in the 12–27B tier",
    sub: "JevBench open-set Intelligence. trutina-4b leads every other 4B model by 6.5 points and ties or beats most 26–35B systems, in one forward pass without reasoning tokens.",
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: "JevBench v1.5.4 official results (open-set Intelligence I_open, 0–100). Parameter counts as named by each system. trutina-4b: I_open computed by us on the public tasks with the v1.5 formula; its sealed-set score is not measured yet.",
  });
}

/* ---------- 3. LocalLLaMA zero-shot ---------- */
function localllama() {
  const rows = D.localllama.rows;
  const W = 900, rowH = 52, top = 10, H = rows.length * rowH + top + 34, lx = 250;
  const x = linScale(50, 80, lx, W - 70);
  let g = "";
  for (const t of [50, 60, 70, 80]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 30}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}%</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2, w = x(r.acc) - lx;
    g += `<text class="${r.ours ? "lbl-us" : "lbl"}" x="${lx - 16}" y="${cy + 1}" text-anchor="end">${esc(r.name)}</text>`;
    g += `<text class="lbl-sub" x="${lx - 16}" y="${cy + 19}" text-anchor="end">${r.open ? "open weights" : "scored via API"}</text>`;
    g += `<rect x="${lx}" y="${cy - 13}" width="${w}" height="26" rx="4" fill="${r.ours ? "var(--fg)" : r.open ? "var(--muted)" : "var(--pale)"}"/>`;
    g += `<text class="${r.ours ? "val" : "val-muted"}" x="${lx + w + 10}" y="${cy + 6}">${r.acc.toFixed(r.acc % 1 && (r.acc * 10) % 1 ? 2 : 1)}</text>`;
  });
  // KL panel
  const W2 = 470, x2 = linScale(0, 1.5, 30, W2 - 30);
  let k = "";
  for (const t of [0, 0.5, 1, 1.5]) k += `<line x1="${x2(t)}" x2="${x2(t)}" y1="${top - 4}" y2="${H - 30}" stroke="var(--grid)"/><text class="axis" x="${x2(t)}" y="${H - 6}" text-anchor="middle">${t}</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    k += `<line x1="${x2(0)}" x2="${x2(r.kl)}" y1="${cy}" y2="${cy}" stroke="${r.ours ? "var(--fg)" : "var(--pale)"}" stroke-width="2"/>`;
    k += r.ours ? usDot(x2(r.kl), cy, 7) : `<circle cx="${x2(r.kl)}" cy="${cy}" r="6" fill="${r.open ? "var(--muted)" : "var(--pale)"}"/>`;
    k += `<text class="${r.ours ? "val" : "val-muted"}" x="${x2(r.kl) + 14}" y="${cy + 5}" style="font-size:14px">${r.kl.toFixed(3)}</text>`;
  });
  return frame({
    title: "Zero-shot on unseen business workflows",
    sub: "LocalLLaMA typed-decisions test: agent monitoring, support, invoices and security incidents, none of them in training. #1 among open-weight models, #2 overall behind one hosted API.",
    body: `<div class="row"><div class="card" style="flex:1.9"><h2>Accuracy <span>· 2,000 questions</span></h2>${svgTag(W, H)}${g}</svg></div>
      <div class="card"><h2>KL to the gold distribution <span>· lower is better</span></h2>${svgTag(W2, H)}${k}</svg></div></div>`,
    src: "Other rows from the LocalLLaMA/typed-decisions dataset card (zero-shot table). trutina-4b measured by us with the released weights at full depth (adaptive: same accuracy, 28 layers on average).",
  });
}

/* ---------- 4. Adaptive depth ---------- */
function adaptive() {
  const E = T.exits, W = 860, H = 470, m = { l: 60, r: 30, t: 20, b: 50 };
  const x = linScale(10, 33, m.l, W - m.r), y = linScale(40, 92, H - m.b, m.t);
  let g = "";
  for (const t of [40, 50, 60, 70, 80, 90]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="axis" x="${m.l - 12}" y="${y(t) + 5}" text-anchor="end">${t}%</text>`;
  for (const l of E.layers) g += `<text class="axis" x="${x(l)}" y="${H - m.b + 26}" text-anchor="middle">${l}</text>`;
  g += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 2}" text-anchor="middle">exit layer</text>`;
  const series = [["jevbench", "JevBench public", "var(--fg)", 3], ["val", "our validation", "var(--muted)", 2.2], ["localllama", "LocalLLaMA", "var(--faint)", 2.2]];
  for (const [k, name, c, w] of series) {
    const pts = E.layers.map((l, i) => [x(l), y(E[k][i])]);
    g += `<path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;
    for (const p of pts) g += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--card)" stroke="${c}" stroke-width="2.2"/>`;
  }
  g += `<text class="lbl-sub" x="${W - m.r}" y="${y(46)}" text-anchor="end">without trained exits, intermediate layers</text>`;
  g += `<text class="lbl-sub" x="${W - m.r}" y="${y(46) + 18}" text-anchor="end">read at chance level until about layer 19</text>`;
  const lineLegend = `<div class="legend">${series.map(([, name, c, w]) => `<span><i><svg width="26" height="12"><line x1="0" x2="26" y1="6" y2="6" stroke="${c}" stroke-width="${w}"/><circle cx="13" cy="6" r="4" fill="#fff" stroke="${c}" stroke-width="2"/></svg></i>${name}</span>`).join("")}</div>`;
  // share bar
  const sh = E.share_val, keys = ["12", "16", "20", "24", "32"], SW = 520;
  let acc = 0, s = "";
  const tones = ["var(--fg)", "var(--ink-2)", "var(--muted)", "var(--faint)", "var(--pale)"];
  keys.forEach((k2, i) => {
    const w = sh[k2] / 100 * SW;
    s += `<rect x="${acc}" y="0" width="${Math.max(w - 2, 1)}" height="44" rx="4" fill="${tones[i]}"/>`;
    s += `<text x="${acc + 6}" y="70" class="lbl" style="font-size:13px">L${k2}</text><text x="${acc + 6}" y="90" class="val" style="font-size:15px">${Math.round(sh[k2])}%</text>`;
    acc += w;
  });
  const kp = (k2, v, f) => `<div class="kpi" style="padding:20px 24px"><span class="k">${k2}</span><span class="v" style="font-size:40px">${v}</span><span class="f">${f}</span></div>`;
  return frame({
    title: "Adaptive depth: stop when the answer is settled",
    sub: "Tuned-lens exits at layers 12, 16, 20 and 24 read the same option letters as the final layer. A request stops at the first confident exit and otherwise continues from it, without recomputing.",
    body: `<div class="row"><div class="card" style="flex:1.6"><h2>Accuracy of each exit <span>· temperature-calibrated</span></h2>${lineLegend}${svgTag(W, H)}${g}</svg></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:20px">
        <div class="card" style="flex:none"><h2>Where adaptive answers <span>· our validation split</span></h2><svg width="${SW}" height="96">${s}</svg></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px">
          ${kp("Layers used", `22.1<small>/ 32</small>`, "on average, JevBench public")}
          ${kp("Accuracy kept", `86.1<small>%</small>`, "vs 87.0% at full depth")}
          ${kp("p50, RTX PRO 6000", `21.1<small>ms</small>`, "vs 28.3 ms at full depth")}
          ${kp("Mean, RTX PRO 6000", `35.3<small>ms</small>`, "every request, HTTP included")}
        </div></div></div>`,
    src: "Per-exit accuracy measured on the training checkpoint before merging (the released weights differ by at most 0.1). Latency: one RTX PRO 6000, serial requests through scripts/serve.py, JevBench public tasks.",
  });
}

/* ---------- 5. Latency on RTX PRO 6000 ---------- */
function latency() {
  const pick = n => D.jevbench.rows.find(r => r.name === n);
  const rows = [
    { name: "trutina-4b · adaptive", p50: T.latency_rtxpro6000.adaptive.p50, p95: T.latency_rtxpro6000.adaptive.p95, hw: "RTX PRO 6000", us: true, by: "us" },
    { name: "trutina-4b · full depth", p50: T.latency_rtxpro6000.full.p50, p95: T.latency_rtxpro6000.full.p95, hw: "RTX PRO 6000", us: true, by: "us" },
    ...[["Cygnet", "Cygnet · 12B"], ["AutoJev-27B (RTX PRO 6000)", "AutoJev · 27B"], ["Surogate Rune 26B-A4B v3 (RTX PRO 6000)", "Surogate Rune · 26B-A4B"],
        ["swanOne", "swanOne"], ["Jev 1.13.0", "Jev 1.13.0 · hosted API"]]
      .map(([n, label]) => { const r = pick(n); return { name: label, p50: r.p50_ms, p95: r.p95_ms, hw: r.hw === "api" ? "end to end" : r.hw, by: "JevBench" }; }),
  ];
  const W = 1470, rowH = 64, top = 10, H = rows.length * rowH + top + 40, lx = 330;
  const x = logScale(10, 1000, lx, W - 150);
  let g = "";
  for (const t of [10, 20, 50, 100, 200, 500, 1000]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 34}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t} ms</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    g += `<text class="${r.us ? "lbl-us" : "lbl"}" x="${lx - 18}" y="${cy + 1}" text-anchor="end" ${r.us ? 'style="font-size:16px"' : ""}>${esc(r.name)}</text>`;
    g += `<text class="lbl-sub" x="${lx - 18}" y="${cy + 19}" text-anchor="end">${esc(r.hw)} · measured by ${r.by}</text>`;
    g += `<line x1="${x(r.p50)}" x2="${x(r.p95)}" y1="${cy}" y2="${cy}" stroke="${r.us ? "var(--fg)" : "var(--faint)"}" stroke-width="2" stroke-dasharray="${r.us ? "" : "3 3"}"/>`;
    g += `<rect x="${lx}" y="${cy - 12}" width="${x(r.p50) - lx}" height="24" rx="4" fill="${r.us ? "var(--fg)" : "var(--pale)"}"/>`;
    g += `<circle cx="${x(r.p95)}" cy="${cy}" r="5" fill="var(--card)" stroke="${r.us ? "var(--fg)" : "var(--faint)"}" stroke-width="2"/>`;
    g += `<text class="${r.us ? "val" : "val-muted"}" x="${x(r.p95) + 14}" y="${cy + 5}">${fmt1(r.p50)} <tspan class="lbl-sub">/ ${fmt1(r.p95)}</tspan></text>`;
  });
  const legend = `<div class="legend"><span><i><svg width="26" height="14"><rect width="26" height="14" rx="3" fill="var(--fg)"/></svg></i>p50</span>
    <span><i><svg width="26" height="14"><line x1="0" x2="20" y1="7" y2="7" stroke="var(--fg)" stroke-width="2"/><circle cx="20" cy="7" r="4.5" fill="#fff" stroke="var(--fg)" stroke-width="2"/></svg></i>p95</span></div>`;
  return frame({
    title: "Nearly twice as fast as the best model on the same GPU",
    sub: "Per-decision latency on an RTX PRO 6000, one request at a time. With adaptive depth trutina-4b answers in 21 ms at the median, about half the 39.8 ms of Cygnet, the most accurate system measured on that GPU.",
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: "Other systems: raw latency measured by JevBench v1.5.4 on its own RTX PRO 6000 pod (450 open standard and judge items), and Jev end to end through its hosted API. trutina-4b: measured by us on one RTX PRO 6000 through its own HTTP server, 231 public JevBench tasks after warm-up. The request sets differ, so read the gap as an order of magnitude.",
  });
}

/* ---------- 6. What fine-tuning adds ---------- */
function finetune() {
  const rows = T.heldout.filter(r => r.set !== "DecisionBench hard");
  const W = 1470, rowH = 78, top = 16, H = rows.length * rowH + top + 40, lx = 330;
  const x = linScale(40, 90, lx, W - 120);
  let g = "";
  for (const t of [40, 50, 60, 70, 80, 90]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H - 34}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t}%</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2, d = r.trutina - r.zero_shot;
    g += `<text class="lbl" x="${lx - 18}" y="${cy + 1}" text-anchor="end" style="font-size:16px; fill:var(--fg); font-weight:500">${esc(r.set)}</text>`;
    g += `<text class="lbl-sub" x="${lx - 18}" y="${cy + 20}" text-anchor="end">${esc(r.metric)}</text>`;
    g += `<line x1="${x(r.zero_shot)}" x2="${x(r.trutina)}" y1="${cy}" y2="${cy}" stroke="var(--fg)" stroke-width="3" opacity="${d > 0 ? 1 : .3}"/>`;
    g += `<circle cx="${x(r.zero_shot)}" cy="${cy}" r="8" fill="var(--card)" stroke="var(--faint)" stroke-width="2.5"/>`;
    g += usDot(x(r.trutina), cy, 9);
    const right = Math.max(x(r.trutina), x(r.zero_shot));
    g += `<text class="val" x="${right + 22}" y="${cy + 6}">${fmt1(r.trutina)} <tspan class="lbl-sub" style="font-size:14px">${d >= 0 ? "+" : ""}${fmt1(d)} vs ${fmt1(r.zero_shot)}</tspan></text>`;
  });
  const legend = `<div class="legend"><span><i><svg width="16" height="16"><circle cx="8" cy="8" r="6.5" fill="#fff" stroke="var(--faint)" stroke-width="2.5"/></svg></i>Qwen3.5-4B, same prompt, untrained</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--fg)"/></svg></i>trutina-4b</span></div>`;
  return frame({
    title: "What the fine-tune adds on held-out benchmarks",
    sub: "Same backbone, same prompt. None of these sets was used for training or for choosing weights. fast-decisions accuracy is flat, but its calibration error halves (ECE 0.251 → 0.122).",
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: "All numbers measured by us. Not shown: DecisionBench hard, where trutina-4b (49.6) is below the untrained backbone (53.6); see the model card for every held-out result.",
  });
}
