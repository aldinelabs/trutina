<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trutina charts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
/* Aldine brand surface (#F3F3F1 / #1D1D16) with Pine's olive neutrals (oklch hue ~107).
   trutina is always the darkest ink; everything else steps down in lightness.
   Radii follow Pine: cards 24px (rounded-[min(var(--radius-4xl),24px)]), inner tiles 18px
   (rounded-2xl), chips and bars fully rounded. */
:root {
  --bg: #f3f3f1;
  --card: #ffffff;
  --fg: #1d1d16;
  --ink-2: oklch(0.394 0.023 107.4);
  --muted: oklch(0.58 0.031 107.3);
  --faint: oklch(0.737 0.021 106.9);
  --pale: oklch(0.88 0.011 106.6);
  --llm: oklch(0.47 0.13 27);  /* dark red: a general reasoning language model among decision systems */
  --border: oklch(0.93 0.007 106.5);
  --grid: oklch(0.955 0.005 106.5);
  --r-card: 24px;
  --r-inner: 18px;
  --sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
:root[lang="zh"] { --sans: "Inter", "Noto Sans SC", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1; }
.frame { width: 1600px; height: 1000px; padding: 56px 64px 44px; display: flex; flex-direction: column; gap: 28px; }
header img { height: 40px; display: block; }
.titles h1 { margin: 0; font-size: 46px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; max-width: 1350px; }
.titles p { margin: 12px 0 0; font-size: 20px; line-height: 1.5; color: var(--muted); text-wrap: pretty; }
:root[lang="zh"] .titles h1 { letter-spacing: 0; font-size: 44px; }
:root[lang="zh"] .titles p { font-size: 19px; }
.card { flex: 1; background: var(--card); border-radius: var(--r-card); padding: 30px 34px;
  box-shadow: 0 0 0 1px oklch(0.153 0.006 107.1 / .05), 0 1px 3px 0 oklch(0 0 0 / .06);
  min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 24px; flex: 1; min-height: 0; }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.card h2 span { color: var(--muted); font-weight: 400; }
svg { display: block; overflow: visible; }
svg text { font-family: var(--sans); }
.axis { fill: var(--muted); font-size: 14px; }
.axis-title { fill: var(--muted); font-size: 14px; font-weight: 500; }
.lbl { fill: var(--ink-2); font-size: 14px; }
.lbl-us { fill: var(--fg); font-size: 17px; font-weight: 700; }
.lbl-sub { fill: var(--muted); font-size: 13px; }
.val { fill: var(--fg); font-size: 15px; font-weight: 600; }
.val-muted { fill: var(--muted); font-size: 15px; font-weight: 500; }
footer { font-size: 13.5px; line-height: 1.55; color: var(--muted); display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
footer .src { flex: 1; min-width: 0; text-wrap: pretty; }
footer .site { font-family: var(--mono); white-space: nowrap; color: var(--ink-2); }
.legend { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 8px; }
.cv-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: auto auto auto auto; column-gap: 20px; row-gap: 0; min-height: 0; margin: auto 0; flex: 0 0 auto; }
.cv-card { background: var(--card); border-radius: var(--r-card); padding: 26px 26px 26px; display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 18px; min-height: 0; }
.cv-head { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.cv-tag { font: 600 12.5px/1 var(--mono); color: var(--fg); border: 1.3px solid var(--fg); border-radius: 999px; padding: 5px 10px; }
.cv-head h3 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
.cv-state { background: var(--bg); border-radius: var(--r-inner); padding: 16px 18px; font-size: 17px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty; aspect-ratio: 16 / 10; box-sizing: border-box; margin: 0; }
.cv-img { width: 100%; aspect-ratio: 16 / 10; box-sizing: border-box; border-radius: var(--r-inner); border: 1px solid var(--border); display: block; }
.cv-q { font-size: 16px; font-weight: 600; line-height: 1.45; text-wrap: balance; word-break: keep-all; }
.cv-out { display: flex; flex-direction: column; gap: 14px; align-self: start; padding-top: 4px; }
.cv-big { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; display: flex; align-items: baseline; }
.cv-big small { font-size: 22px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 2px; }
.cv-big span { font-size: 18px; font-weight: 600; letter-spacing: 0; margin-left: 12px; }
.cv-bars { display: flex; flex-direction: column; gap: 7px; }
.cv-row { display: grid; grid-template-columns: 38% 1fr 40px; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
.cv-k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-track { height: 10px; border-radius: 5px; background: var(--grid); overflow: hidden; }
.cv-track i { display: block; height: 100%; border-radius: 5px; background: var(--pale); }
.cv-row.top { color: var(--fg); font-weight: 600; }
.cv-row.top .cv-track i { background: var(--fg); }
.cv-p { text-align: right; font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.kpi { background: var(--card); border-radius: var(--r-card); padding: 28px 30px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 0 0 1px oklch(0.153 0.006 107.1 / .05), 0 1px 3px 0 oklch(0 0 0 / .06); }
.kpi.inner { border-radius: var(--r-inner); }
.kpi .k { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 54px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.kpi .v small { font-size: 22px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.kpi .f { font-size: 15px; color: var(--ink-2); line-height: 1.45; }
.grid5 { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 14px; flex: 1; min-height: 0; }
.panel { background: var(--card); border-radius: var(--r-card); padding: 16px 22px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 0;
  box-shadow: 0 0 0 1px oklch(0.153 0.006 107.1 / .05), 0 1px 3px 0 oklch(0 0 0 / .06); }
.panel h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.panel .m { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.panel.sum { justify-content: center; gap: 10px; }
.panel.sum .big { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.panel.sum .big small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.panel.sum p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.pill4 { display: inline-block; font: 600 0.66em/1 var(--mono); background: var(--fg); color: #fff; border-radius: 999px; padding: 0.32em 0.62em; margin-left: 0.45em; vertical-align: 0.14em; }
.mk { height: 1.15em; width: auto; vertical-align: -0.22em; margin-right: 6px; }
.titles h1 .mk { height: 0.95em; vertical-align: -0.1em; margin-right: 14px; }
.pillv { background: var(--card); color: var(--fg); box-shadow: inset 0 0 0 1.3px var(--fg); }
.titles h1 .pill4 { font-size: 0.4em; vertical-align: 0.55em; margin-left: 0.35em; margin-right: 0.15em; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script src="data.js"></script>
<script>
const D = window.DATA, T = D.trutina;
const LANG = new URLSearchParams(location.search).get("lang") === "zh" ? "zh" : "en";
document.documentElement.lang = LANG;
const zh = LANG === "zh";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
const ms = " ms";
const MARK = "brand/aldine-symbol.svg", MK = `<img class="mk" src="${MARK}" alt="">`, PILL = `<span class="pill4">4B</span>`;
const VIS = zh ? "多模态" : "Multimodal", VPILL = `<span class="pill4 pillv">${VIS}</span>`;

/* The Aldine symbol beside every label of ours: each SVG text.lbl-us gets the mark to its left, sized to the text. */
function placeMarks() {
  const NS = "http://www.w3.org/2000/svg", el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  for (const t of document.querySelectorAll("svg text.lbl-us")) {
    let b = t.getBBox();
    const h = b.height, s = Math.round(h * 0.92);
    // pills after the name: the dark 4B pill unless data-nopill, an outlined multimodal pill with data-vision;
    // a right-aligned label moves left to make room
    const pills = [...(t.hasAttribute("data-nopill") ? [] : [["4B", true]]), ...(t.hasAttribute("data-vision") ? [[VIS, false]] : [])];
    if (pills.length) {
      const ph = Math.round(h * 0.78), gap = Math.round(h * 0.32), end = t.getAttribute("text-anchor") === "end";
      let after = t;
      const made = pills.map(([label, dark]) => {
        const r = el("rect", { height: ph, rx: ph / 2, fill: dark ? "var(--fg)" : "var(--card)", stroke: dark ? "none" : "var(--fg)", "stroke-width": 1.3 });
        const tx = el("text", { "text-anchor": "middle", style: `font: 600 ${Math.round(ph * 0.62)}px var(--mono); fill: ${dark ? "#fff" : "var(--fg)"}` });
        tx.textContent = label;
        after.after(r); r.after(tx); after = tx;
        const w = Math.max(Math.round(ph * 2.05), Math.ceil(tx.getComputedTextLength() + ph * 0.9));
        return { r, tx, w };
      });
      if (end) t.setAttribute("x", +t.getAttribute("x") - made.reduce((a, m) => a + m.w + gap, 0));
      const nb = t.getBBox(), py = nb.y + (nb.height - ph) / 2;
      let px = nb.x + nb.width + gap;
      for (const m of made) {
        m.r.setAttribute("x", px); m.r.setAttribute("y", py); m.r.setAttribute("width", m.w);
        m.tx.setAttribute("x", px + m.w / 2); m.tx.setAttribute("y", py + ph * 0.72);
        px += m.w + gap;
      }
      b = t.getBBox();
    }
    t.parentNode.insertBefore(el("image", { href: MARK, width: s, height: s, x: b.x - s - s * 0.38, y: b.y + (b.height - s) / 2 }), t);
  }
}

function frame({ title, sub, body, src }) {
  return `<header><img src="brand/aldine-tm.svg" alt="Aldine"></header>
    <div class="titles"><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>
    ${body}
    <footer><div class="src">${src}</div><div class="site">huggingface.co/aldinelabs/trutina-4b</div></footer>`;
}

/* ---------- SVG helpers ---------- */
function linScale(d0, d1, r0, r1) { return v => r0 + (v - d0) / (d1 - d0) * (r1 - r0); }
function logScale(d0, d1, r0, r1) { const a = Math.log10(d0), b = Math.log10(d1); return v => r0 + (Math.log10(v) - a) / (b - a) * (r1 - r0); }
const svgTag = (w, h) => `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%; flex:1; min-height:0">`;
const bar = (x, y, w, h, fill) => `<rect x="${x}" y="${y}" width="${Math.max(w, h)}" height="${h}" rx="${h / 2}" fill="${fill}"/>`;
const usDot = (x, y, r = 9) => `<circle cx="${x}" cy="${y}" r="${r + 7}" fill="var(--fg)" opacity=".08"/><circle cx="${x}" cy="${y}" r="${r}" fill="var(--fg)" stroke="var(--card)" stroke-width="2.5"/>`;
const chip = (x, y, text, dark) => `<rect x="${x}" y="${y - 12}" width="50" height="24" rx="12" fill="${dark ? "var(--fg)" : "var(--card)"}" stroke="${dark ? "none" : "var(--pale)"}"/>
  <text x="${x + 25}" y="${y + 5}" text-anchor="middle" style="font: 600 13px var(--mono); fill:${dark ? "#fff" : "var(--ink-2)"}">${text}</text>`;

/* ---------- Same-run helpers: the six 4B systems on one JevBench re-run (lab/modal/compete_modal.py) ---------- */
const RUNS = () => D.compete.runs.map(r => ({ ...r, label: r.us ? (r.mode === "adaptive" ? (zh ? "Trutina · 自适应深度" : "Trutina · adaptive") : (zh ? "Trutina · 完整深度" : "Trutina · full depth")) : r.name }));
const SAME_RUN_ZH = "6 个开放 4B 决策模型各经其作者提供的服务端（固定 revision），在同型号 GPU（RTX PRO 6000）上串行处理同一批 231 道 JevBench 公开题，预热 10 条，计 HTTP 往返。";
const US_ZH = "Trutina 为 v3 权重，启用是非题决断映射，经 CUDA graph 服务（不超过 2,048 token 的请求重放 graph）。Trutina 的 Intelligence 取自 v3 评测中服务端返回的逐题概率；延迟在与对比运行同配置的容器中测得，该容器内不启用 graph 时为 20.8 / 35.3 / 108.9 ms（p50 / 平均 / p95，自适应深度），与对比运行相差不超过 1%。其他系统按其服务端的原始输出计分。";
const US_EN = "Trutina: v3 weights with the decisive yes/no map, served with CUDA graphs (requests up to 2,048 tokens replay graphs). Its Intelligence comes from the per-task probabilities the server returned in the v3 evaluation; its latency was measured in a container configured like the comparison run, where the same server without graphs gives 20.8 / 35.3 / 108.9 ms (p50 / mean / p95, adaptive depth), within 1% of the comparison run. Other systems are scored on their servers' outputs as served.";
const SAME_RUN_EN = "Six open 4B decision models, each through the server its authors ship (pinned revision), one request at a time on the same GPU type (RTX PRO 6000), the same 231 public JevBench tasks after 10 warm-up requests, HTTP round trip included.";

/* ---------- Pareto: Intelligence vs mean latency, same run ---------- */
function pareto() {
  // the whole JevBench board at p50 against Intelligence; Trutina placed by estimate, with its uncertainty as a bar
  const B = D.board, rows = B.rows;
  const W = 1470, H = 560, m = { l: 70, r: 30, t: 20, b: 56 };
  const x = logScale(10, 10000, m.l, W - m.r), y = linScale(40, 100, H - m.b, m.t);
  const front = []; let best = -1;
  for (const r of [...rows].sort((a, b) => a.p50 - b.p50 || b.i - a.i)) if (r.i > best) { front.push(r); best = r.i; }
  let g = "";
  for (const t of [40, 50, 60, 70, 80, 90, 100]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="axis" x="${m.l - 14}" y="${y(t) + 5}" text-anchor="end">${t}</text>`;
  for (const [t, l] of [[10, "10 ms"], [30, "30 ms"], [100, "100 ms"], [300, "300 ms"], [1000, "1 s"], [3000, "3 s"], [10000, "10 s"]]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - m.b + 26}" text-anchor="middle">${l}</text>`;
  g += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">${zh ? "单请求 p50 延迟（对数坐标，越靠左越快）" : "p50 latency per request (log scale), faster to the left"}</text>`;
  g += `<text class="axis-title" transform="translate(16 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">${zh ? "JevBench Intelligence（官方）" : "JevBench Intelligence (official)"}</text>`;
  const st = front.flatMap((r, i) => [[x(r.p50), i ? y(front[i - 1].i) : H - m.b], [x(r.p50), y(r.i)]]);
  st.push([W - m.r, y(front.at(-1).i)]);
  const P = pts => pts.map(([a, b]) => `${a.toFixed(1)},${b.toFixed(1)}`).join(" L");
  g += `<path d="M${P(st)} L${W - m.r},${H - m.b} Z" fill="var(--fg)" opacity=".05"/>`;
  g += `<text class="axis-title" x="${W - m.r - 16}" y="${H - m.b - 16}" text-anchor="end">${zh ? "被支配区域：更慢，且不更准" : "dominated: slower and no more accurate"}</text>`;
  g += `<path d="M${P(st.slice(1))}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="5 5" opacity=".55"/>`;
  for (const r of rows.filter(r => !r.us)) g += `<circle cx="${x(r.p50)}" cy="${y(r.i)}" r="${front.includes(r) ? 6 : 4.5}" fill="${r.llm ? "var(--llm)" : front.includes(r) ? "var(--muted)" : "var(--pale)"}" stroke="var(--card)" stroke-width="1.2"/>`;
  const lab = { "decider-2b": [12, 18, "start"], "Cygnet": [-10, -12, "end"], "djev": [8, -12, "start"], "Eikos-27B": [10, 20, "start"],
                "Open Jev JSON Canvas": [10, 20, "start"], "OpenJev": [10, 20, "start"], "GPT-5.6 Luna": [-10, 18, "end"], "GPT-6 Luna": [-10, -10, "end"] };
  for (const r of front.filter(r => !r.us)) {
    const L = lab[r.name] || [10, -10, "start"];
    g += `<text class="lbl" x="${x(r.p50) + L[0]}" y="${y(r.i) + L[1]}" text-anchor="${L[2]}" style="font-size:13px">${esc(r.name)} <tspan class="lbl-sub" style="font-size:12px">${fmt1(r.i)}</tspan></text>`;
  }
  for (const r of rows.filter(r => r.us)) {
    const cx = x(r.p50), cy = y(r.i), ad = r.mode === "adaptive";
    // error bar with caps for the estimate's range
    g += `<path d="M${cx},${y(r.i_lo)} V${y(r.i_hi)} M${cx - 7},${y(r.i_lo)} H${cx + 7} M${cx - 7},${y(r.i_hi)} H${cx + 7}" stroke="var(--fg)" stroke-width="1.8" opacity=".55" fill="none"/>`;
    g += ad ? usDot(cx, cy, 8) : `<circle cx="${cx}" cy="${cy}" r="7" fill="var(--card)" stroke="var(--fg)" stroke-width="2.5"/>`;
    // labels sit in the empty top-left corner, each on a leader straight up from its point
    const ly = y(ad ? 91 : 81), dx = -10, dy = ly - cy, an = "start";
    g += `<line x1="${cx}" x2="${cx}" y1="${y(r.i_hi) - 8}" y2="${ly + 28}" stroke="var(--fg)" stroke-width="1" stroke-dasharray="2 3" opacity=".4"/>`;
    const name = ad ? (zh ? "Trutina · 自适应深度" : "Trutina · adaptive") : (zh ? "Trutina · 完整深度" : "Trutina · full depth");
    g += `<text class="lbl-us" data-vision x="${cx + dx}" y="${cy + dy}" text-anchor="${an}" style="font-size:15px">${name}</text>`;
    g += `<text class="lbl-sub" x="${cx + dx}" y="${cy + dy + 18}" text-anchor="${an}">${zh ? `预估 ${fmt1(r.i)}（${fmt1(r.i_lo)}–${fmt1(r.i_hi)}）` : `est. ${fmt1(r.i)} (${fmt1(r.i_lo)}–${fmt1(r.i_hi)})`} · ${fmt1(r.p50)} ms</text>`;
  }
  const legend = `<div class="legend">
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--fg)"/></svg></i>${MK}Trutina${PILL}${zh ? " · 预估分，误差棒为换算范围" : " · estimated score, error bar = conversion range"}</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="5.5" fill="var(--muted)"/></svg></i>${zh ? "前沿上的系统" : "on the frontier"}</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="4.5" fill="var(--pale)"/></svg></i>${zh ? "其他决策系统" : "other decision systems"}</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="5.5" fill="var(--llm)"/></svg></i>${zh ? "通用 / 推理语言模型" : "general / reasoning language models"}</span>
    <span><i><svg width="26" height="10"><line x1="0" x2="26" y1="5" y2="5" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/></svg></i>${zh ? "帕累托前沿" : "Pareto frontier"}</span>
    <span><i><svg width="20" height="14"><rect width="20" height="14" rx="3" fill="var(--fg)" opacity=".08"/></svg></i>${zh ? "被支配区域" : "dominated"}</span></div>`;
  const n = rows.filter(r => !r.us).length, o = B.offsets;
  return frame(zh ? {
    title: "进一步推进准确率与速度的帕累托前沿",
    sub: `JevBench v1.5.4 官方榜单上 Intelligence ≥ 40 的 ${n} 个系统。按预估分，Trutina 的两种深度都落在前沿上，是 30 ms 以内唯一高于 62 分的系统。`,
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,

/* ---------- LocalLLaMA zero-shot ---------- */
function localllama() {
  const rows = D.localllama.rows;
  const W = 900, rowH = 44, top = 8, H = rows.length * rowH + top + 34, lx = 250;
  const x = linScale(50, 80, lx, W - 70);
  let g = "";
  for (const t of [50, 60, 70, 80]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 30}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}%</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    g += `<text class="${r.ours ? "lbl-us" : "lbl"}" ${r.ours ? "data-vision" : ""} x="${lx - 16}" y="${cy + 1}" text-anchor="end" style="font-size:${r.ours ? 16 : 14}px">${esc(r.name)}</text>`;
    g += `<text class="lbl-sub" x="${lx - 16}" y="${cy + 17}" text-anchor="end">${r.open ? (zh ? "开放权重" : "open weights") : (zh ? "经 API 评测" : "scored via API")} · ${r.by === "us" ? (zh ? "本文实测" : "measured by us") : (zh ? "数据集卡片" : "dataset card")}</text>`;
    g += bar(lx, cy - 11, x(r.acc) - lx, 22, r.ours ? "var(--fg)" : r.by === "us" ? "var(--muted)" : "var(--pale)");
    g += `<text class="${r.ours ? "val" : "val-muted"}" x="${x(r.acc) + 10}" y="${cy + 6}">${r.acc}</text>`;
  });
  const W2 = 470, x2 = linScale(0, 1.5, 30, W2 - 30);
  let k = "";
  for (const t of [0, 0.5, 1, 1.5]) k += `<line x1="${x2(t)}" x2="${x2(t)}" y1="${top - 4}" y2="${H - 30}" stroke="var(--grid)"/><text class="axis" x="${x2(t)}" y="${H - 6}" text-anchor="middle">${t}</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    k += `<line x1="${x2(0)}" x2="${x2(r.kl)}" y1="${cy}" y2="${cy}" stroke="${r.ours ? "var(--fg)" : "var(--pale)"}" stroke-width="2" stroke-linecap="round"/>`;
    k += r.ours ? usDot(x2(r.kl), cy, 7) : `<circle cx="${x2(r.kl)}" cy="${cy}" r="6" fill="${r.by === "us" ? "var(--muted)" : "var(--pale)"}"/>`;
    k += `<text class="${r.ours ? "val" : "val-muted"}" x="${x2(r.kl) + 14}" y="${cy + 5}" style="font-size:14px">${r.kl.toFixed(3)}</text>`;
  });
  const cards = (a, b) => `<div class="row"><div class="card" style="flex:1.9"><h2>${a}</h2>${svgTag(W, H)}${g}</svg></div><div class="card"><h2>${b}</h2>${svgTag(W2, H)}${k}</svg></div></div>`;
  return frame(zh ? {
    title: "开源模型中迄今为止最强大的通用领域零样本决策",
    sub: "LocalLLaMA typed-decisions 测试集，涵盖 agent 监控、客户服务、发票处理与安全事件等场景，均未出现在训练数据中。Trutina 在开放权重模型中准确率最高，总榜仅次于一个托管 API；KL 散度略高于 Sieve-4B。",
    body: cards("准确率 <span>· 2,000 题</span>", "与标注分布的 KL 散度 <span>· 越低越好</span>"),
    src: "标注「数据集卡片」的行取自 LocalLLaMA/typed-decisions 数据集卡片的零样本榜单；标注「本文实测」的 6 个开放 4B 决策模型由我们经各自作者提供的服务端、按卡片协议（每个 case 的五道题放在一个请求中）在同型号 GPU 上测得。",
  } : {
    title: "The strongest open model yet for general zero-shot decisions",
    sub: "LocalLLaMA typed-decisions test: agent monitoring, support, invoices and security incidents, none of them in training. Trutina has the highest accuracy among open-weight models, second overall behind one hosted API; its KL is slightly above Sieve-4B's.",
    body: cards("Accuracy <span>· 2,000 questions</span>", "KL to the gold distribution <span>· lower is better</span>"),
    src: "Rows marked 'dataset card' are from the zero-shot table of the LocalLLaMA/typed-decisions card. The six open 4B decision models marked 'measured by us' ran through their authors' servers with the card's protocol (a case's five questions in one request) on the same GPU type.",
  });
}

/* ---------- Perplexity decision panel: 4B against Jev, Qwen3.8-27B and Perplexity Decider 27B ---------- */
function panel() {
  // the claim is against Qwen3.8-27B, so the chart shows only that gap: one diverging bar per task
  const P = D.panel, tasks = [...P.tasks].sort((a, b) => (b.trutina - b.qwen) - (a.trutina - a.qwen));
  const rows = [...tasks, { name: zh ? "按题数加权总分" : "Row-weighted overall", total: true, ...P.overall }];
  const W = 1470, rowH = 50, top = 40, H = rows.length * rowH + top + 66, lx = 330, rx = W - 250;
  const lim = Math.ceil(Math.max(...rows.map(r => Math.abs(r.trutina - r.qwen))) / 10) * 10;
  const x = linScale(-lim, lim, lx + 70, rx - 70), x0 = x(0);
  let g = "";
  for (let t = -lim; t <= lim; t += 10) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 8}" y2="${H - 58}" stroke="${t ? "var(--grid)" : "var(--faint)"}" stroke-width="${t ? 1 : 1.5}"/><text class="axis" x="${x(t)}" y="${H - 32}" text-anchor="middle">${t > 0 ? "+" : ""}${t}</text>`;
  g += `<text class="axis-title" x="${x(lim / 2)}" y="${top - 18}" text-anchor="middle">${zh ? "Trutina 领先 →" : "Trutina ahead →"}</text>`;
  g += `<text class="axis-title" x="${x(-lim / 2)}" y="${top - 18}" text-anchor="middle">${zh ? "← Qwen3.8-27B 领先" : "← Qwen3.8-27B ahead"}</text>`;
  g += `<text class="axis-title" x="${W - 40}" y="${top - 18}" text-anchor="end">${zh ? "Trutina / Qwen" : "Trutina / Qwen"}</text>`;
  g += `<text class="axis" x="${x0}" y="${H - 10}" text-anchor="middle">${zh ? "准确率差（百分点）" : "accuracy gap (points)"}</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2 + (r.total ? 14 : 0), d = r.trutina - r.qwen, up = d >= 0;
    if (r.total) g += `<line x1="${lx - 300}" x2="${W - 40}" y1="${cy - rowH / 2 - 2}" y2="${cy - rowH / 2 - 2}" stroke="var(--border)"/>`;
    g += `<text class="lbl" x="${lx}" y="${cy + 1}" text-anchor="end" style="font-size:${r.total ? 16 : 15}px; ${r.total ? "font-weight:700; fill:var(--fg)" : ""}">${esc(r.name)}</text>`;
    if (!r.total) g += `<text class="lbl-sub" x="${lx}" y="${cy + 17}" text-anchor="end">${r.rows.toLocaleString()} ${zh ? "题" : "rows"}</text>`;
    const h = r.total ? 28 : 22, w = Math.abs(x(d) - x0);
    g += `<rect x="${up ? x0 : x0 - w}" y="${cy - h / 2}" width="${Math.max(w, 3)}" height="${h}" rx="5" fill="${up ? "var(--fg)" : "var(--pale)"}"/>`;
    g += `<text class="${up ? "val" : "val-muted"}" x="${up ? x0 + w + 12 : x0 - w - 12}" y="${cy + 5}" text-anchor="${up ? "start" : "end"}" style="font-size:${r.total ? 18 : 15}px">${up ? "+" : "−"}${Math.abs(d).toFixed(1)}</text>`;
    g += `<text class="val-muted" x="${W - 40}" y="${cy + 5}" text-anchor="end" style="font-size:15px"><tspan style="fill:var(--fg); font-weight:${r.total ? 700 : 600}">${r.trutina.toFixed(1)}</tspan> / ${r.qwen.toFixed(1)}</text>`;
  });
  const o = P.overall, wins = P.tasks.filter(t => t.trutina > t.qwen).length;
  return frame(zh ? {
    title: "决策质量超越数倍于自身大小的通用语言模型",
    sub: `Perplexity 决策面板 10 项公开任务、${P.n.toLocaleString()} 题。Trutina 在 ${wins} 项上领先，按题数加权为 ${o.trutina}，Qwen3.8-27B 为 ${o.qwen}；专用的 Jev 1.13.0 与 Perplexity Decider 27B 分别为 ${o.jev} 与 ${o.pplx}。`,
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: "Qwen3.8-27B（以及副标题中 Jev 1.13.0、Perplexity Decider 27B）的数值取自 Perplexity 公布的 11 项决策面板（2026 年 9 月测得，经 benchlm.ai 汇总），其抽样题目、提示词与标签映射未公开。Trutina 为上一版 v2.1 权重、完整深度（v3 尚未在此面板上测量），由我们在同型号公开切分上按相同题数固定种子抽样测得，并已剔除与训练数据近似重复的题目（8-gram 重合 ≥ 30%）；Circa 因出现在训练数据中而未纳入。JudgeBench 为两种顺序的单题准确率，JevBench public hard 为当前版本的 111 题（面板为 101 题）。此为近似对比，并非复现。",
  } : {
    title: "Better decisions than a general LLM several times its size",
    sub: `Perplexity's decision panel, 10 public tasks, ${P.n.toLocaleString()} rows. Trutina leads on ${wins} tasks and scores ${o.trutina} weighted by rows against Qwen3.8-27B's ${o.qwen}; the dedicated Jev 1.13.0 and Perplexity Decider 27B score ${o.jev} and ${o.pplx}.`,
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: "Qwen3.8-27B (and, in the subtitle, Jev 1.13.0 and Perplexity Decider 27B): Perplexity's published 11-task decision panel (measured September 2026, collected by benchlm.ai); its sampled items, prompts and label mappings are unpublished. Trutina: the previous v2.1 weights at full depth (v3 has not been run on this panel), measured by us on the same public splits with the same row counts (fixed seed), near-duplicates of our training data removed (≥ 30% shared 8-grams); Circa is left out because it was in our training data. JudgeBench is per-request accuracy over both orders; JevBench public hard is the current 111 tasks (the panel used 101). An approximate comparison, not a replication.",
  });
}

/* ---------- Latency against larger systems on the same GPU type ---------- */
function bigger() {
  // two groups, p50 only, linear scale, each bar labelled with how many times Trutina's adaptive p50 it is
  const all = D.bigger, ad = all.find(r => r.us && r.mode === "adaptive"), full = all.find(r => r.us && r.mode === "full");
  const name = r => r.us ? (zh ? "Trutina · 自适应深度" : "Trutina · adaptive") : r.name;
  const small = all.filter(r => r.by === "us" && !(r.us && r.mode === "full"));
  const large = all.filter(r => r.by === "official" && r.i_open >= 50);
  const groups = [[zh ? "4B 决策模型 · 同一容器内实测" : "4B decision models · measured side by side", small],
                  [zh ? "12–35B 决策系统 · JevBench 官方测得" : "12–35B decision systems · JevBench official", large]];
  const W = 1470, rowH = 46, headH = 52, lx = 380, xr = W - 190;
  const x = linScale(0, 220, lx, xr);
  const H = groups.reduce((h, [, rs]) => h + headH + rs.length * rowH, 0) + 44;
  let g = "", y = 0;
  for (const t of [0, 50, 100, 150, 200]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${headH - 18}" y2="${H - 34}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t} ms</text>`;
  for (const [title, rs] of groups) {
    g += `<text class="axis-title" x="${lx}" y="${y + headH - 16}" style="font-size:15px; fill:var(--ink-2)">${title}</text>`;
    y += headH;
    // Trutina's p50 carried down through the group as the reference
    g += `<line x1="${x(ad.p50)}" x2="${x(ad.p50)}" y1="${y + 2}" y2="${y + rs.length * rowH - 2}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/>`;
    for (const r of rs) {
      const cy = y + rowH / 2, k = r.p50 / ad.p50;
      g += `<text class="${r.us ? "lbl-us" : "lbl"}" data-nopill ${r.us ? "data-vision" : ""} x="${lx - 70}" y="${cy + 5}" text-anchor="end" style="font-size:${r.us ? 17 : 15}px">${esc(name(r))}</text>`;
      g += chip(lx - 58, cy, r.size === "?" ? (zh ? "未公开" : "n/a") : r.size, r.us);
      g += bar(lx, cy - 13, x(r.p50) - lx, 26, r.us ? "var(--fg)" : "var(--pale)");
      g += r.us
        ? `<text class="val" x="${x(r.p50) + 14}" y="${cy + 6}" style="font-size:19px">${fmt1(r.p50)} ms</text>`
        : `<text class="val-muted" x="${x(r.p50) + 14}" y="${cy + 5}">${fmt1(r.p50)} ms <tspan style="fill:var(--fg); font-weight:700">· ${k.toFixed(1)}×</tspan></text>`;
      y += rowH;
    }
  }
  const s4 = small.filter(r => !r.us).map(r => r.p50 / ad.p50), sl = large.map(r => r.p50 / ad.p50);
  const rng = a => `${Math.min(...a).toFixed(1)}–${Math.max(...a).toFixed(1)}`;
  const p95s = small.filter(r => !r.us).map(r => r.p95);
  return frame(zh ? {
    title: "业界最低可用决策延迟",
    sub: `Trutina 自适应深度的 p50 为 ${fmt1(ad.p50)} ms；另外 5 个 4B 决策模型为其 ${rng(s4)} 倍，12–35B 系统为 ${rng(sl)} 倍。RTX PRO 6000，串行单请求。`,
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: `4B 模型由我们在同一 Modal 容器、同一 231 道 JevBench 公开题上测得，各用其作者提供的服务端（HTTP 往返，预热 10 条）；Trutina 经 CUDA graph 服务，完整深度为 ${fmt1(full.p50)} ms。p95：Trutina ${fmt1(ad.p95)} ms，另外 5 个 4B 为 ${fmt1(Math.min(...p95s))}–${fmt1(Math.max(...p95s))} ms。12–35B 系统为 JevBench v1.5.4 官方结果，由维护方在其 RTX PRO 6000 测试机上以 450 个请求串行测得（原始值），取 Intelligence ≥ 50 者；官方榜单上没有在 RTX PRO 6000 上测得的 4B 系统。两组的测试机与请求集不同。在整个 JevBench v1.5.4 官方榜单（各型号 GPU）上，p50 低于 Trutina 的只有 decider-2b（13.7 ms，H100），其 Intelligence 为 48.8；Intelligence ≥ 50 的系统中最快的是 JevK5 v0.3（15.8 ms，H100）。`,
  } : {
    title: "The lowest usable decision latency",
    sub: `Trutina's adaptive-depth p50 is ${fmt1(ad.p50)} ms; the five other 4B decision models take ${rng(s4)}× as long, the 12–35B systems ${rng(sl)}×. RTX PRO 6000, one request at a time.`,
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: `4B models: measured by us in one Modal container on the same 231 public JevBench tasks, each through its authors' server (HTTP round trip, 10 warm-up requests); Trutina is served with CUDA graphs and takes ${fmt1(full.p50)} ms at full depth. p95: Trutina ${fmt1(ad.p95)} ms, the other 4B models ${fmt1(Math.min(...p95s))}–${fmt1(Math.max(...p95s))} ms. 12–35B systems: JevBench v1.5.4 official results, measured by the maintainers on their RTX PRO 6000 pods over 450 serial requests (raw), those with Intelligence ≥ 50; the official board has no 4B system measured on an RTX PRO 6000. The two groups differ in machines and requests. Across the whole JevBench v1.5.4 official board (any GPU), only decider-2b (13.7 ms, H100) has a lower p50 than Trutina, at Intelligence 48.8; the fastest system at Intelligence ≥ 50 is JevK5 v0.3 (15.8 ms, H100).`,
  });
}

/* ---------- typed-decisions: 4B against 27B and closed decision systems ---------- */
function typed() {
  const rows = D.typed.rows, LLM = r => r.name.startsWith("GPT-");
  const W = 1470, rowH = 70, top = 12, H = rows.length * rowH + top + 40, lx = 360;
  const x = linScale(0, 100, lx, W - 170);
  const size = r => r.size === "closed" ? (zh ? "闭源" : "closed") : r.size;
  let g = "";
  for (const t of [0, 20, 40, 60, 80, 100]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 34}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t}</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2, a = r.acc / 2, c = Math.max(r.cal, 0) / 2, col = r.ours ? "var(--fg)" : LLM(r) ? "var(--llm)" : "var(--muted)";
    g += `<text class="${r.us ? "lbl-us" : r.ours ? "lbl-us" : "lbl"}" data-nopill x="${lx - 80}" y="${cy + 1}" text-anchor="end" style="font-size:${r.ours ? 17 : 15}px">${esc(r.name)}</text>`;
    g += `<text class="lbl-sub" x="${lx - 80}" y="${cy + 19}" text-anchor="end">${zh ? "准确率" : "accuracy"} ${r.acc.toFixed(1)}% · Brier ${r.brier.toFixed(3)}</text>`;
    g += chip(lx - 66, cy, size(r), r.ours);
    g += `<rect x="${x(0)}" y="${cy - 14}" width="${x(a) - x(0)}" height="28" rx="6" fill="${col}"/>`;
    if (c > 0) g += `<rect x="${x(a) + 2}" y="${cy - 14}" width="${Math.max(x(a + c) - x(a) - 2, 2)}" height="28" rx="6" fill="${col}" opacity=".45"/>`;
    g += `<text class="${r.ours ? "val" : "val-muted"}" x="${x(a + c) + 14}" y="${cy + 6}" style="font-size:${r.ours ? 18 : 16}px">${r.index.toFixed(1)}</text>`;
  });
  const legend = `<div class="legend"><span><i><svg width="26" height="14"><rect width="26" height="14" rx="4" fill="var(--fg)"/></svg></i>${zh ? "准确率 × ½" : "accuracy × ½"}</span>
    <span><i><svg width="26" height="14"><rect width="26" height="14" rx="4" fill="var(--fg)" opacity=".45"/></svg></i>${zh ? "校准分 × ½（相对均匀猜测的 Brier 改善）" : "calibration × ½ (Brier improvement over a uniform guess)"}</span>
    <span><i><svg width="26" height="14"><rect width="26" height="14" rx="4" fill="var(--llm)"/></svg></i>${zh ? "推理语言模型" : "reasoning language model"}</span></div>`;
  const us = rows.find(r => r.ours), d27 = rows.find(r => r.size === "27B");
  return frame(zh ? {
    title: "将前沿决策智能以真正可部署的尺寸开放给每一个人",
    sub: `typed-decisions 测试集 2,000 题（400 个案例 × 5 题）。指数为准确率与校准分各占一半。Trutina 为 ${us.index.toFixed(1)}，仅次于闭源的 Celeris-1，高于 Decider v1.1 27B（${d27.index.toFixed(1)}）、Jev 1.13.0 与 GPT-6 Luna。`,
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: `指数 = ½ × 准确率 + ½ × 校准分，校准分 = 100 ×（1 − Brier ÷ 均匀猜测的 Brier），均匀猜测在该测试集上的 Brier 为 ${D.typed.brier_uniform}；Mercury Decide 的 Brier 高于均匀猜测，校准分记为 0。除 Trutina 外，准确率与 Brier 取自 Celeris-1 Decision 发布时公布的对比表（评测框架 0cfd276，由 Celeris 自行测得，经 benchlm.ai 汇总），未能返回分布的请求按均匀分布计分。Trutina 为已发布权重、完整深度，由我们在同一测试集上测得；Brier 按每题各选项与软标签之差的平方和计算，Celeris 未公布其切分与 Brier 的归一化方式。`,
  } : {
    title: "Frontier decision intelligence, open to all at a deployable size",
    sub: `typed-decisions test, 2,000 questions (400 cases × 5). The index weighs accuracy and calibration equally. Trutina scores ${us.index.toFixed(1)}, second only to the closed Celeris-1 and above Decider v1.1 27B (${d27.index.toFixed(1)}), Jev 1.13.0 and GPT-6 Luna.`,
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: `Index = ½ × accuracy + ½ × calibration, calibration = 100 × (1 − Brier ÷ the Brier of a uniform guess), which is ${D.typed.brier_uniform} on this test; Mercury Decide's Brier is above the uniform guess's, so its calibration counts as 0. Other systems' accuracy and Brier: the table Celeris published with Celeris-1 Decision (harness 0cfd276, measured by Celeris, collected by benchlm.ai), requests without a distribution scored as uniform. Trutina: released weights at full depth, measured by us on the same test; Brier is the per-question sum over options of the squared difference to the soft label. Celeris did not publish its split or Brier normalisation.`,
  });
}

/* ---------- Adaptive depth ---------- */
function adaptive() {
  const ad = D.compete.runs.find(r => r.us && r.mode === "adaptive"), full = D.compete.runs.find(r => r.us && r.mode === "full");
  const E = T.exits, W = 860, H = 470, m = { l: 60, r: 30, t: 20, b: 50 };
  const x = linScale(10, 33, m.l, W - m.r), y = linScale(40, 92, H - m.b, m.t);
  let g = "";
  for (const t of [40, 50, 60, 70, 80, 90]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="axis" x="${m.l - 12}" y="${y(t) + 5}" text-anchor="end">${t}%</text>`;
  for (const l of E.layers) g += `<text class="axis" x="${x(l)}" y="${H - m.b + 26}" text-anchor="middle">${l}</text>`;
  g += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 2}" text-anchor="middle">${zh ? "停下作答的层" : "layer it stops at"}</text>`;
  const series = [["val", zh ? "验证集" : "our validation split", "var(--fg)", 3], ["localllama", "LocalLLaMA", "var(--muted)", 2.2]];
  for (const [k2, , c, w] of series) {
    const pts = E.layers.map((l, i) => [x(l), y(E[k2][i])]);
    g += `<path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const p of pts) g += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--card)" stroke="${c}" stroke-width="2.2"/>`;
  }
  g += `<text class="lbl-sub" x="${W - m.r}" y="${y(46)}" text-anchor="end">${zh ? "不专门训练出口的话，" : "without trained exits,"}</text>`;
  g += `<text class="lbl-sub" x="${W - m.r}" y="${y(46) + 18}" text-anchor="end">${zh ? "前 19 层基本只能瞎猜" : "the first 19 layers barely beat a guess"}</text>`;
  const lineLegend = `<div class="legend">${series.map(([, name, c, w]) => `<span><i><svg width="26" height="12"><line x1="0" x2="26" y1="6" y2="6" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><circle cx="13" cy="6" r="4" fill="#fff" stroke="${c}" stroke-width="2"/></svg></i>${name}</span>`).join("")}</div>`;
  const sh = E.share_val, keys = ["12", "16", "20", "24", "32"], SW = 520, tones = ["var(--fg)", "var(--ink-2)", "var(--muted)", "var(--faint)", "var(--pale)"];
  let acc = 0, s = "", lastX = 0;
  keys.forEach((k2, i) => {
    const w = sh[k2] / 100 * SW;
    s += `<rect x="${acc}" y="0" width="${Math.max(w - 3, 1)}" height="44" rx="${Math.min(12, (w - 3) / 2)}" fill="${tones[i]}"/>`;
    const lx2 = Math.max(acc + 4, lastX);  // labels never overlap a narrow segment's neighbour
    s += `<text x="${lx2}" y="70" class="lbl" style="font-size:13px">L${k2}</text><text x="${lx2}" y="90" class="val" style="font-size:15px">${Math.round(sh[k2])}%</text>`;
    lastX = lx2 + 44;
    acc += w;
  });
  const kp = (k2, v, f) => `<div class="kpi inner" style="padding:22px 24px"><span class="k">${k2}</span><span class="v" style="font-size:40px">${v}</span><span class="f">${f}</span></div>`;
  const K = zh ? [["平均只用", `${fmt1(E.mean_layers.jevbench)}<small>/ 32 层</small>`, "省下约三分之一的计算"], ["准确率", `${fmt1(E.adaptive.jevbench)}<small>%</small>`, `走完全部 32 层为 ${fmt1(E.full.jevbench)}%`], ["中位延迟", `${fmt1(ad.p50)}<small>ms</small>`, `走完全部 32 层为 ${fmt1(full.p50)} ms`], ["平均延迟", `${fmt1(ad.mean)}<small>ms</small>`, `走完全部 32 层为 ${fmt1(full.mean)} ms`]]
    : [["Layers used", `${fmt1(E.mean_layers.jevbench)}<small>/ 32</small>`, "about a third of the compute saved"], ["Accuracy", `${fmt1(E.adaptive.jevbench)}<small>%</small>`, `${fmt1(E.full.jevbench)}% with all 32 layers`], ["Median latency", `${fmt1(ad.p50)}<small>ms</small>`, `${fmt1(full.p50)} ms with all 32 layers`], ["Mean latency", `${fmt1(ad.mean)}<small>ms</small>`, `${fmt1(full.mean)} ms with all 32 layers`]];
  const body = `<div class="row"><div class="card" style="flex:1.6"><h2>${zh ? "在第几层停下来作答，准确率是多少" : "How accurate the answer is if it stops at each layer"}</h2>${lineLegend}${svgTag(W, H)}${g}</svg></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:20px">
        <div class="card" style="flex:none"><h2>${zh ? "请求实际在哪一层停下" : "Where requests actually stop"}</h2><svg width="${SW}" height="96">${s}</svg></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px">${K.map(a => kp(...a)).join("")}</div></div></div>`;
  return frame(zh ? {
    title: "业界首个可变深度决策模型",
    sub: "简单的题在浅层就有把握，提前给出答案；只有难题才走完全部 32 层。平均少算三分之一，准确率几乎不变。",
    body, src: "第 12、16、20、24 层各有一个训练过的出口，与最后一层用同样的方式读出答案；置信度够高就在该层作答，否则接着往后算，不重复计算前面的层。各层准确率在合并 LoRA 之前的训练检查点上测得（与发布权重相差不超过 0.1）；停下层的分布取自验证集；右侧层数与准确率为 JevBench 公开集；延迟为单张 RTX PRO 6000 上串行请求（CUDA graph），用 v2.1 权重测得，v3 架构与出口相同。",
  } : {
    title: "The first decision model with variable depth",
    sub: "Easy questions are settled in the early layers and answered there; only the hard ones go through all 32. A third less compute on average, at nearly the same accuracy.",
    body, src: "Trained exits at layers 12, 16, 20 and 24 read the answer the same way as the last layer; a request answers at the first exit that is confident enough and otherwise carries on, without recomputing earlier layers. Per-exit accuracy measured on the training checkpoint before the LoRA merge (the released weights differ by at most 0.1); where requests stop: our validation split; layers and accuracy: JevBench public tasks; latency: serial requests on one RTX PRO 6000 (CUDA graphs), measured with the v2.1 weights; v3 has the same architecture and exits.",
  });
}

/* ---------- Dumbbell helper (fine-tune, vision) ---------- */
function dumbbell(rows, lo, hi, labels, o = {}) {
  const W = o.W || 1470, rowH = o.rowH || 80, top = 16, H = rows.length * rowH + top + 40, lx = o.lx || 360, step = o.step || 10;
  const x = linScale(lo, hi, lx, W - (o.rm || 140));
  let g = "";
  for (let t = lo; t <= hi; t += step) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H - 34}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t}%</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2, d = r.after - r.before;
    g += `<text class="lbl" x="${lx - 18}" y="${cy + (r.sub ? 1 : 6)}" text-anchor="end" style="font-size:16px; fill:var(--fg); font-weight:500">${esc(r.set)}</text>`;
    if (r.sub) g += `<text class="lbl-sub" x="${lx - 18}" y="${cy + 20}" text-anchor="end">${esc(r.sub)}</text>`;
    g += `<line x1="${x(r.before)}" x2="${x(r.after)}" y1="${cy}" y2="${cy}" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" opacity="${d > 0 ? 1 : .3}"/>`;
    g += `<circle cx="${x(r.before)}" cy="${cy}" r="8" fill="var(--card)" stroke="var(--faint)" stroke-width="2.5"/>`;
    g += usDot(x(r.after), cy, 9);
    g += `<text class="val" x="${Math.max(x(r.after), x(r.before)) + 22}" y="${cy + 6}">${fmt1(r.after)} <tspan class="lbl-sub" style="font-size:14px">${d >= 0 ? "+" : ""}${fmt1(d)} · ${labels.vs} ${fmt1(r.before)}</tspan></text>`;
  });
  const legend = `<div class="legend"><span><i><svg width="16" height="16"><circle cx="8" cy="8" r="6.5" fill="#fff" stroke="var(--faint)" stroke-width="2.5"/></svg></i>${labels.before}</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--fg)"/></svg></i>${MK}Trutina${PILL}</span></div>`;
  return `<div class="card">${o.h2 ? `<h2>${o.h2}</h2>` : ""}${legend}<div style="flex:1; display:flex; align-items:center">${svgTag(W, H)}${g}</svg></div></div>`;
}

/* ---------- Held-out text benchmarks and image questions ---------- */
function heldout() {
  const sub = { accuracy: zh ? "准确率" : "accuracy", "state-macro acc.": zh ? "按 state 宏平均的准确率" : "state-macro accuracy", "pair accuracy": zh ? "两种选项顺序均正确方计为正确" : "pair accuracy, both orders" };
  const name = { "JevBench public": zh ? "JevBench 公开集" : "JevBench public" };
  const text = T.heldout.filter(r => r.set !== "DecisionBench hard").map(r => ({ set: name[r.set] || r.set, sub: sub[r.metric] || r.metric, before: r.zero_shot, after: r.trutina }));
  const names = zh ? { "Rendered workflow screenshots": "渲染的工作流截图" } : { "Rendered workflow screenshots": "Rendered workflows" };
  const subs = { ScienceQA: zh ? "含插图的科学问答" : "science with diagrams", Mind2Web: zh ? "网页智能体：目标元素选择" : "web agents: element to act on",
    "A-OKVQA": zh ? "依赖世界知识的视觉问答" : "VQA needing world knowledge", "Rendered workflow screenshots": zh ? "以图像形式呈现的工作流状态" : "workflow states as images" };
  const img = T.vision.map(r => ({ ...r, sub: subs[r.set], set: names[r.set] || r.set }));
  const o = { W: 740, lx: 235, rm: 185, rowH: 90 };
  const left = dumbbell(text, 40, 90, zh ? { before: "Qwen3.5-4B，相同 prompt，未微调", vs: "未微调" } : { before: "Qwen3.5-4B, same prompt, untrained", vs: "untrained" },
    { ...o, h2: zh ? "文本 held-out 基准 <span>· 公开数据集，未用于训练</span>" : "Held-out text benchmarks <span>· public sets, not trained on</span>" });
  const right = dumbbell(img, 70, 100, zh ? { before: "v2（仅文本微调，未经图像训练）", vs: "v2" } : { before: "v2 (text-only fine-tune)", vs: "v2" },
    { ...o, h2: zh ? "图像输入 <span>· 验证集，与训练同分布</span>" : "Image questions <span>· validation split, in-distribution</span>" });
  const body = `<div class="row">${left}${right}</div>`;
  return frame(zh ? {
    title: "在未见过的基准与图像上依然有效",
    sub: "左：与相同骨干、相同 prompt 的未微调模型对比，fast-decisions 上准确率持平，但校准误差降低约四成（ECE 0.251 → 0.142）。右：Qwen3.5 视觉编码器保持冻结，加入约 3.5 万道图像题训练后，网页智能体类判断由 75.0 提升至 93.0。",
    body, src: "全部结果均为自行测得。左图数据集既未用于训练，也未用于权重选择；未列出 DecisionBench hard，该基准上 Trutina（52.5）低于未微调的骨干模型（53.6）。右图为自建验证集（非公开基准），对照组 v2 为同一架构、仅经文本微调的版本；Decision Index 视觉套件尚未评测。",
  } : {
    title: "Gains on held-out benchmarks and image questions",
    sub: "Left: against the untrained model with the same backbone and prompt; fast-decisions accuracy is flat but calibration error drops by about 40% (ECE 0.251 → 0.142). Right: with the Qwen3.5 vision tower frozen, training on about 35k image questions lifts web-agent decisions from 75.0 to 93.0.",
    body, src: "All numbers measured by us. Left: none of these sets was used for training or for choosing weights; not shown is DecisionBench hard, where Trutina (52.5) is below the untrained backbone (53.6). Right: our own validation split, not a public benchmark; v2 is the same architecture fine-tuned on text only. The Decision Index vision suite has not been run yet.",
  });
}

/* ---------- Release cover: four use cases, each answered by the released weights ---------- */
function cover() {
  const KIND = zh ? { noul: "是非题", choice: "选择题", score: "等级题", image: "图像 · 选择题" } : { noul: "yes / no", choice: "choice", score: "score", image: "image · choice" };
  const pct = p => `${Math.round(p * 100)}<small>%</small>`;
  const bars = (rows, top) => `<div class="cv-bars">${rows.map(([k, p]) => `<div class="cv-row${k === top ? " top" : ""}"><span class="cv-k">${esc(k)}</span><span class="cv-track"><i style="width:${Math.max(p * 100, 1.5)}%"></i></span><span class="cv-p">${Math.round(p * 100)}%</span></div>`).join("")}</div>`;
  const card = ex => {
    const q = ex.request.questions.q, a = ex.answer;
    const input = ex.kind === "image" ? `<img class="cv-img" src="cover/${ex.request.state}" alt="">` : `<div class="cv-state">${esc(ex.request.state).replace(/\n/g, "<br>")}</div>`;
    let out;
    if (a.type === "noul") out = `<div class="cv-big">${pct(a.noul)}<span>${zh ? "是" : "yes"}</span></div>${bars([[zh ? "是" : "yes", a.noul], [zh ? "否" : "no", 1 - a.noul]], zh ? "是" : "yes")}`;
    else if (a.type === "score") out = `<div class="cv-big">${a.score.toFixed(1)}<span>/ ${Object.keys(a.legend).length - 1} · ${esc(a.legend[Math.round(a.score)])}</span></div>${bars(Object.entries(a.legend).map(([i, l]) => [l, a.probabilities[i]]).reverse(), a.legend[Object.entries(a.probabilities).sort((x, y) => y[1] - x[1])[0][0]])}`;
    else {
      const name = k => k;
      const rows = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]);
      out = `<div class="cv-big">${pct(rows[0][1])}<span>${esc(name(rows[0][0]))}</span></div>${bars(rows.map(([k, p]) => [name(k), p]), name(a.choice))}`;
    }
    return `<div class="cv-card"><div class="cv-head"><span class="cv-tag">${KIND[ex.kind]}</span><h3>${esc(ex.title)}</h3></div>${input}<div class="cv-q">${esc(q.instructions)}</div><div class="cv-out">${out}</div></div>`;
  };
  const body = `<div class="cv-grid">${D.cover[zh ? "zh" : "en"].map(card).join("")}</div>`;
  return frame(zh ? {
    title: `Trutina${PILL}${VPILL}：单次前向传播的校准决策模型`,
    sub: "读取文本与图像，回答是非题、选择题与等级题，为每个选项给出概率，不生成文本。",
    body, src: "四个用例的输出均为已发布权重（aldinelabs/trutina-4b）的真实结果：本地 MLX 引擎、自适应深度，每个用例只运行一次，未经挑选。界面截图为示例绘制。Apache-2.0，提供 MLX、CUDA 引擎与 HTTP 服务。",
  } : {
    title: `Trutina${PILL}${VPILL}: calibrated decisions in one forward pass`,
    sub: "Reads text and images, answers yes/no, choice and score questions with a probability for every option, and generates no text.",
    body, src: "Every answer shown is the real output of the released weights (aldinelabs/trutina-4b): local MLX engine, adaptive depth, each example run once and not cherry-picked. The screen is drawn for the example. Apache-2.0, with MLX and CUDA engines and an HTTP server.",
  });
}


const CHARTS = { typed, panel, bigger, cover, pareto, localllama, adaptive, heldout };
document.getElementById("frame").innerHTML = CHARTS[location.hash.slice(1) || "cover"]();
document.fonts.ready.then(() => { placeMarks(); document.body.dataset.ready = "1"; });
</script>
