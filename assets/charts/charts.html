<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>trutina-4b charts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
/* Aldine brand surface (#F3F3F1 / #1D1D16) with Pine's olive neutrals (oklch hue ~107).
   trutina is always the darkest ink; everything else steps down in lightness.
   Radii follow Pine: cards 24px (rounded-[min(var(--radius-4xl),24px)]), inner tiles 18px
   (rounded-2xl), chips and bars fully rounded. */
:root {
  --bg: #f3f3f1;
  --card: #ffffff;
  --fg: #1d1d16;
  --ink-2: oklch(0.394 0.023 107.4);
  --muted: oklch(0.58 0.031 107.3);
  --faint: oklch(0.737 0.021 106.9);
  --pale: oklch(0.88 0.011 106.6);
  --border: oklch(0.93 0.007 106.5);
  --grid: oklch(0.955 0.005 106.5);
  --r-card: 24px;
  --r-inner: 18px;
  --sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
:root[lang="zh"] { --sans: "Inter", "Noto Sans SC", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1; }
.frame { width: 1600px; height: 1000px; padding: 56px 64px 44px; display: flex; flex-direction: column; gap: 28px; }
header img { height: 40px; display: block; }
.titles h1 { margin: 0; font-size: 46px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; max-width: 1350px; }
.titles p { margin: 12px 0 0; font-size: 20px; line-height: 1.5; color: var(--muted); max-width: 1300px; }
:root[lang="zh"] .titles h1 { letter-spacing: 0; font-size: 44px; }
:root[lang="zh"] .titles p { font-size: 19px; }
.card { flex: 1; background: var(--card); border-radius: var(--r-card); padding: 30px 34px;
  box-shadow: 0 0 0 1px oklch(0.153 0.006 107.1 / .05), 0 1px 3px 0 oklch(0 0 0 / .06);
  min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 24px; flex: 1; min-height: 0; }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.card h2 span { color: var(--muted); font-weight: 400; }
svg { display: block; overflow: visible; }
svg text { font-family: var(--sans); }
.axis { fill: var(--muted); font-size: 14px; }
.axis-title { fill: var(--muted); font-size: 14px; font-weight: 500; }
.lbl { fill: var(--ink-2); font-size: 14px; }
.lbl-us { fill: var(--fg); font-size: 17px; font-weight: 700; }
.lbl-sub { fill: var(--muted); font-size: 13px; }
.val { fill: var(--fg); font-size: 15px; font-weight: 600; }
.val-muted { fill: var(--muted); font-size: 15px; font-weight: 500; }
footer { font-size: 13.5px; line-height: 1.55; color: var(--muted); display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
footer .src { max-width: 1250px; }
footer .site { font-family: var(--mono); white-space: nowrap; color: var(--ink-2); }
.legend { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 8px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.kpi { background: var(--card); border-radius: var(--r-card); padding: 28px 30px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 0 0 1px oklch(0.153 0.006 107.1 / .05), 0 1px 3px 0 oklch(0 0 0 / .06); }
.kpi.inner { border-radius: var(--r-inner); }
.kpi .k { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 54px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.kpi .v small { font-size: 22px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.kpi .f { font-size: 15px; color: var(--ink-2); line-height: 1.45; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script src="data.js"></script>
<script>
const D = window.DATA, T = D.trutina;
const LANG = new URLSearchParams(location.search).get("lang") === "zh" ? "zh" : "en";
document.documentElement.lang = LANG;
const zh = LANG === "zh";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
const ms = " ms";

function frame({ title, sub, body, src }) {
  return `<header><img src="brand/aldine-tm.svg" alt="Aldine"></header>
    <div class="titles"><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>
    ${body}
    <footer><div class="src">${src}</div><div class="site">huggingface.co/aldinelabs/trutina-4b</div></footer>`;
}

/* ---------- SVG helpers ---------- */
function linScale(d0, d1, r0, r1) { return v => r0 + (v - d0) / (d1 - d0) * (r1 - r0); }
function logScale(d0, d1, r0, r1) { const a = Math.log10(d0), b = Math.log10(d1); return v => r0 + (Math.log10(v) - a) / (b - a) * (r1 - r0); }
const svgTag = (w, h) => `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%; flex:1; min-height:0">`;
const bar = (x, y, w, h, fill) => `<rect x="${x}" y="${y}" width="${Math.max(w, h)}" height="${h}" rx="${h / 2}" fill="${fill}"/>`;
const usDot = (x, y, r = 9) => `<circle cx="${x}" cy="${y}" r="${r + 7}" fill="var(--fg)" opacity=".08"/><circle cx="${x}" cy="${y}" r="${r}" fill="var(--fg)" stroke="var(--card)" stroke-width="2.5"/>`;
const chip = (x, y, text, dark) => `<rect x="${x}" y="${y - 12}" width="50" height="24" rx="12" fill="${dark ? "var(--fg)" : "var(--card)"}" stroke="${dark ? "none" : "var(--pale)"}"/>
  <text x="${x + 25}" y="${y + 5}" text-anchor="middle" style="font: 600 13px var(--mono); fill:${dark ? "#fff" : "var(--ink-2)"}">${text}</text>`;
const pick = n => D.jevbench.rows.find(r => r.name === n);
const pretty = n => n.replace(" (RTX PRO 6000)", "").replace(" v3", "");

/* ---------- Pareto: Intelligence vs latency ---------- */
function pareto() {
  const W = 1470, H = 520, m = { l: 70, r: 30, t: 20, b: 56 };
  const rows = D.jevbench.rows.filter(r => r.kind !== "cpu" && r.i_open >= 45 && r.p50_ms >= 10);
  const us = { i_open: T.i_open, p50_ms: T.latency_rtxpro6000.full.p50 };
  const x = logScale(10, 10000, m.l, W - m.r), y = linScale(45, 100, H - m.b, m.t);
  const front = []; let best = -1;
  for (const r of [...rows, us].sort((a, b) => a.p50_ms - b.p50_ms)) if (r.i_open > best) { front.push(r); best = r.i_open; }
  let g = "";
  for (const t of [50, 60, 70, 80, 90, 100]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="axis" x="${m.l - 14}" y="${y(t) + 5}" text-anchor="end">${t}</text>`;
  for (const t of [10, 30, 100, 300, 1000, 3000, 10000]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - m.b + 26}" text-anchor="middle">${t >= 1000 ? t / 1000 + " s" : t + " ms"}</text>`;
  g += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">${zh ? "单次判断的 p50 延迟（对数坐标，越靠左越快）" : "p50 latency per decision (log scale), faster to the left"}</text>`;
  g += `<text class="axis-title" transform="translate(16 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">${zh ? "JevBench 公开集 Intelligence" : "JevBench open-set Intelligence"}</text>`;
  g += `<rect x="${x(us.p50_ms)}" y="${y(us.i_open)}" width="${W - m.r - x(us.p50_ms)}" height="${H - m.b - y(us.i_open)}" rx="${18}" fill="var(--fg)" opacity=".035"/>`;
  g += `<text class="lbl-sub" x="${W - m.r - 16}" y="${H - m.b - 16}" text-anchor="end">${zh ? "延迟更高且准确率更低" : "slower and less accurate than trutina-4b"}</text>`;
  g += `<path d="M${front.map(r => `${x(r.p50_ms).toFixed(1)},${y(r.i_open).toFixed(1)}`).join(" L")}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="5 5" opacity=".55"/>`;
  for (const r of rows) {
    const cx = x(r.p50_ms), cy = y(r.i_open);
    g += r.kind === "api"
      ? `<rect x="${cx - 5.5}" y="${cy - 5.5}" width="11" height="11" rx="3" fill="var(--card)" stroke="var(--faint)" stroke-width="2"/>`
      : `<circle cx="${cx}" cy="${cy}" r="6" fill="${r.params_b === 4 ? "var(--muted)" : "var(--pale)"}" stroke="${r.params_b === 4 ? "var(--card)" : "var(--faint)"}" stroke-width="1.5"/>`;
  }
  g += usDot(x(us.p50_ms), y(us.i_open), 10);
  const lab = {
    "JevK5 v0.3": [-10, -12, "end"], "Plumb-4B": [0, 26, "middle"], "decider-4b v2": [12, 20, "start"],
    "Cygnet": [0, -16, "middle"], "djev": [10, 20, "start"], "Eikos-27B": [10, -12, "start"],
    "AutoJev-27B (RTX PRO 6000)": [12, 22, "start"], "Surogate Rune 26B-A4B v3 (RTX PRO 6000)": [12, 20, "start"],
    "Jev 1.13.0": [12, 18, "start"], "GPT-6 Luna (medium effort)": [-12, -12, "end"], "OpenJev (thinking)": [-12, -12, "end"],
    "Gemini 3.1 Flash-Lite": [12, 18, "start"], "DeepSeek V4.1 Flash (thinking)": [12, 18, "start"], "Open Jev JSON Canvas": [0, -14, "middle"],
  };
  for (const r of rows) {
    const L = lab[r.name]; if (!L) continue;
    const size = r.params_b ? ` · ${r.params_b}B` : r.kind === "api" ? " · API" : "";
    g += `<text class="lbl" x="${x(r.p50_ms) + L[0]}" y="${y(r.i_open) + L[1]}" text-anchor="${L[2]}">${esc(pretty(r.name))}<tspan class="lbl-sub">${size}</tspan></text>`;
  }
  g += `<text class="lbl-us" x="${x(us.p50_ms) - 18}" y="${y(us.i_open) - 18}" text-anchor="end">trutina-4b</text>`;
  g += `<text class="lbl-sub" x="${x(us.p50_ms) - 18}" y="${y(us.i_open) + 2}" text-anchor="end">69.0 · 28 ms</text>`;
  const L = zh ? ["trutina-4b", "其他 4B 模型", "其他本地部署模型", "托管 API", "帕累托前沿"] : ["trutina-4b", "other 4B models", "other self-hosted models", "hosted APIs", "Pareto frontier"];
  const legend = `<div class="legend">
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--fg)"/></svg></i>${L[0]}</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="var(--muted)"/></svg></i>${L[1]}</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="var(--pale)" stroke="var(--faint)" stroke-width="1.5"/></svg></i>${L[2]}</span>
    <span><i><svg width="16" height="16"><rect x="2" y="2" width="12" height="12" rx="3" fill="#fff" stroke="var(--faint)" stroke-width="2"/></svg></i>${L[3]}</span>
    <span><i><svg width="26" height="10"><line x1="0" x2="26" y1="5" y2="5" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/></svg></i>${L[4]}</span></div>`;
  return frame(zh ? {
    title: "trutina-4b 位于准确率–延迟帕累托前沿",
    sub: "在 JevBench v1.5.4 榜单中，不存在延迟与准确率同时优于 trutina-4b 的系统：准确率更高的系统延迟均更高，延迟更低的系统准确率均更低。",
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: `其他系统数据取自 JevBench v1.5.4 官方结果：公开集 Intelligence 与原始 p50 延迟，由榜单维护方在其自有 GPU（H100、RTX 5090、RTX PRO 6000、A6000）上测得；托管 API 为端到端延迟。trutina-4b 的 Intelligence 按 v1.5 公式在公开题上自行计算，延迟在单张 RTX PRO 6000 上经 HTTP 服务自行测得。图中共 ${rows.length} 个系统（Intelligence ≥ 45）。`,
  } : {
    title: "On the accuracy–latency frontier",
    sub: "No system on the JevBench v1.5.4 board is both faster and more accurate than trutina-4b. Everything more accurate is slower, and everything faster is less accurate.",
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: `Other systems: JevBench v1.5.4 official results, open-set Intelligence and raw p50 latency measured by the maintainers on their own GPUs (H100, RTX 5090, RTX PRO 6000, A6000); hosted APIs end to end. trutina-4b: Intelligence computed by us with the v1.5 formula on the public tasks; latency measured by us on one RTX PRO 6000 through its HTTP server. ${rows.length} systems with Intelligence ≥ 45.`,
  });
}

/* ---------- Efficiency Index: Intelligence per ms ---------- */
function efficiency() {
  const FLOOR = 65;
  const others = D.jevbench.rows.filter(r => r.i_open >= FLOOR && r.kind !== "cpu").map(r => ({ ...r, ei: r.i_open / r.p50_ms }));
  const rows = [
    { name: zh ? "trutina-4b · 自适应深度" : "trutina-4b · adaptive", i_open: T.i_open, p50_ms: T.latency_rtxpro6000.adaptive.p50, us: true, hw: "RTX PRO 6000", params_b: 4 },
    { name: zh ? "trutina-4b · 完整深度" : "trutina-4b · full depth", i_open: T.i_open, p50_ms: T.latency_rtxpro6000.full.p50, us: true, hw: "RTX PRO 6000", params_b: 4 },
    ...others,
  ].map(r => ({ ...r, ei: r.i_open / r.p50_ms })).sort((a, b) => b.ei - a.ei).slice(0, 12);
  const W = 1470, rowH = 44, top = 8, H = rows.length * rowH + top + 34, lx = 470;
  const x = linScale(0, 3.5, lx, W - 230);
  let g = "";
  for (const t of [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 30}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    g += `<text class="${r.us ? "lbl-us" : "lbl"}" x="${lx - 76}" y="${cy + 5}" text-anchor="end" ${r.us ? 'style="font-size:16px"' : ""}>${esc(r.us ? r.name : pretty(r.name))}<tspan class="lbl-sub"> · ${esc(r.hw)}</tspan></text>`;
    g += chip(lx - 64, cy, r.params_b ? `${r.params_b}B` : r.kind === "api" ? "API" : "—", r.params_b === 4);
    g += bar(lx, cy - 12, x(r.ei) - lx, 24, r.us ? "var(--fg)" : "var(--pale)");
    g += `<text class="${r.us ? "val" : "val-muted"}" x="${x(r.ei) + 12}" y="${cy + 5}">${r.ei.toFixed(2)} <tspan class="lbl-sub">${fmt1(r.i_open)} / ${fmt1(r.p50_ms)} ms</tspan></text>`;
  });
  const next = rows.find(r => !r.us);
  return frame(zh ? {
    title: "Efficiency Index：单位延迟的准确率",
    sub: `Efficiency Index 定义为 JevBench 公开集 Intelligence 与 p50 延迟（ms）之比，比较范围为 Intelligence ≥ ${FLOOR} 的系统。trutina-4b 的指数为 ${rows[0].ei.toFixed(2)}，为次优系统 ${pretty(next.name)}（${next.ei.toFixed(2)}）的 ${(rows[0].ei / next.ei).toFixed(1)} 倍。`,
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: `设置 Intelligence ≥ ${FLOOR} 的门槛，是为避免延迟极低而准确率明显偏低的模型主导该比值；若不设门槛，若干 Intelligence 为 56–62、在 H100 上延迟约 16 ms 的 4B 模型指数更高。数据来源同帕累托图。trutina-4b 的延迟在 RTX PRO 6000 上自行测得，其他系统由 JevBench 在各自的 GPU 上测得，硬件条件不完全一致。`,
  } : {
    title: "Efficiency Index: accuracy per millisecond",
    sub: `Efficiency Index = JevBench open-set Intelligence ÷ p50 latency in ms, among systems with Intelligence ≥ ${FLOOR}. trutina-4b scores ${rows[0].ei.toFixed(2)}, ${(rows[0].ei / next.ei).toFixed(1)}× the next system, ${pretty(next.name)} (${next.ei.toFixed(2)}).`,
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: `Only systems with Intelligence ≥ ${FLOOR} are compared, so that much faster but much less accurate models do not dominate the ratio; without the floor, several 4B models with Intelligence 56–62 at about 16 ms on an H100 score higher. Sources as in the frontier chart. trutina-4b latency measured by us on an RTX PRO 6000; the others by JevBench on their own GPUs, so the hardware is not identical.`,
  });
}

/* ---------- Size: 4B against 12–35B ---------- */
function size() {
  const big = ["Eikos-27B", "Cygnet", "AutoJev-27B (RTX PRO 6000)", "Jev-Omni", "Surogate Rune 26B-A4B v3 (RTX PRO 6000)", "NInfer Qwen3.8-27B NVFP4", "decider-35b-a3b", "reflex-27b"].map(pick).filter(Boolean);
  const small = ["spark-s1-4b-v6", "decider-4b v2", "JevK5 v0.3", "Plumb-4B", "Malkuth-4B", "Decision 4B v1.2"].map(pick).filter(Boolean);
  const rows = [{ name: "trutina-4b", i_open: T.i_open, params_b: 4, us: true }, ...big, ...small].sort((a, b) => b.i_open - a.i_open);
  const W = 1470, rowH = 38, top = 8, H = rows.length * rowH + top + 30, lx = 330;
  const x = linScale(40, 80, lx, W - 120);
  let g = "";
  for (const t of [40, 50, 60, 70, 80]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 26}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 4}" text-anchor="middle">${t}</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2, four = r.params_b === 4;
    g += `<text class="${r.us ? "lbl-us" : "lbl"}" x="${lx - 76}" y="${cy + 5}" text-anchor="end" ${r.us ? 'style="font-size:16px"' : ""}>${esc(pretty(r.name))}</text>`;
    g += chip(lx - 64, cy, `${r.params_b}B`, four);
    g += bar(lx, cy - 11, x(r.i_open) - lx, 22, r.us ? "var(--fg)" : four ? "var(--muted)" : "var(--pale)");
    g += `<text class="${r.us ? "val" : "val-muted"}" x="${x(r.i_open) + 10}" y="${cy + 5}">${fmt1(r.i_open)}</text>`;
  });
  return frame(zh ? {
    title: "4B 参数规模达到 12–27B 模型的水平",
    sub: "指标为 JevBench 公开集 Intelligence。trutina-4b 高出其余 4B 模型 6.5 分，与多数 26–35B 系统相当或更高；且仅需单次前向传播，不生成推理 token。",
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: "数据取自 JevBench v1.5.4 官方结果（公开集 Intelligence，0–100）。参数量以各系统名称所标为准。trutina-4b 的 Intelligence 按 v1.5 公式在公开题上自行计算，封闭集成绩尚未测量。",
  } : {
    title: "A 4B model in the 12–27B tier",
    sub: "JevBench open-set Intelligence. trutina-4b is 6.5 points ahead of every other 4B model and level with or ahead of most 26–35B systems, in one forward pass with no reasoning tokens.",
    body: `<div class="card">${svgTag(W, H)}${g}</svg></div>`,
    src: "JevBench v1.5.4 official results (open-set Intelligence, 0–100). Parameter counts as named by each system. trutina-4b: Intelligence computed by us with the v1.5 formula on the public tasks; its sealed-set score is not measured yet.",
  });
}

/* ---------- LocalLLaMA zero-shot ---------- */
function localllama() {
  const rows = D.localllama.rows;
  const W = 900, rowH = 52, top = 10, H = rows.length * rowH + top + 34, lx = 250;
  const x = linScale(50, 80, lx, W - 70);
  let g = "";
  for (const t of [50, 60, 70, 80]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 30}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}%</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    g += `<text class="${r.ours ? "lbl-us" : "lbl"}" x="${lx - 16}" y="${cy + 1}" text-anchor="end">${esc(r.name)}</text>`;
    g += `<text class="lbl-sub" x="${lx - 16}" y="${cy + 19}" text-anchor="end">${r.open ? (zh ? "开放权重" : "open weights") : (zh ? "经 API 评测" : "scored via API")}</text>`;
    g += bar(lx, cy - 13, x(r.acc) - lx, 26, r.ours ? "var(--fg)" : r.open ? "var(--muted)" : "var(--pale)");

}

/* ---------- Adaptive depth ---------- */
function adaptive() {
  const E = T.exits, W = 860, H = 470, m = { l: 60, r: 30, t: 20, b: 50 };
  const x = linScale(10, 33, m.l, W - m.r), y = linScale(40, 92, H - m.b, m.t);
  let g = "";
  for (const t of [40, 50, 60, 70, 80, 90]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="axis" x="${m.l - 12}" y="${y(t) + 5}" text-anchor="end">${t}%</text>`;
  for (const l of E.layers) g += `<text class="axis" x="${x(l)}" y="${H - m.b + 26}" text-anchor="middle">${l}</text>`;
  g += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 2}" text-anchor="middle">${zh ? "出口层" : "exit layer"}</text>`;
  const series = [["jevbench", zh ? "JevBench 公开集" : "JevBench public", "var(--fg)", 3], ["val", zh ? "验证集" : "our validation split", "var(--muted)", 2.2], ["localllama", "LocalLLaMA", "var(--faint)", 2.2]];
  for (const [k2, , c, w] of series) {
    const pts = E.layers.map((l, i) => [x(l), y(E[k2][i])]);
    g += `<path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const p of pts) g += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--card)" stroke="${c}" stroke-width="2.2"/>`;
  }
  g += `<text class="lbl-sub" x="${W - m.r}" y="${y(46)}" text-anchor="end">${zh ? "若不训练出口，中间层读出" : "without trained exits, intermediate layers"}</text>`;
  g += `<text class="lbl-sub" x="${W - m.r}" y="${y(46) + 18}" text-anchor="end">${zh ? "在约第 19 层之前接近随机水平" : "read at chance level until about layer 19"}</text>`;
  const lineLegend = `<div class="legend">${series.map(([, name, c, w]) => `<span><i><svg width="26" height="12"><line x1="0" x2="26" y1="6" y2="6" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><circle cx="13" cy="6" r="4" fill="#fff" stroke="${c}" stroke-width="2"/></svg></i>${name}</span>`).join("")}</div>`;
  const sh = E.share_val, keys = ["12", "16", "20", "24", "32"], SW = 520, tones = ["var(--fg)", "var(--ink-2)", "var(--muted)", "var(--faint)", "var(--pale)"];
  let acc = 0, s = "";
  keys.forEach((k2, i) => {
    const w = sh[k2] / 100 * SW;
    s += `<rect x="${acc}" y="0" width="${Math.max(w - 3, 1)}" height="44" rx="${Math.min(12, (w - 3) / 2)}" fill="${tones[i]}"/>`;
    s += `<text x="${acc + 4}" y="70" class="lbl" style="font-size:13px">L${k2}</text><text x="${acc + 4}" y="90" class="val" style="font-size:15px">${Math.round(sh[k2])}%</text>`;
    acc += w;
  });
  const kp = (k2, v, f) => `<div class="kpi inner" style="padding:22px 24px"><span class="k">${k2}</span><span class="v" style="font-size:40px">${v}</span><span class="f">${f}</span></div>`;
  const K = zh ? [["平均层数", `22.1<small>/ 32</small>`, "JevBench 公开集"], ["准确率", `86.1<small>%</small>`, "完整深度为 87.0%"], ["p50，RTX PRO 6000", `21.1<small>ms</small>`, "完整深度为 28.3 ms"], ["平均延迟，RTX PRO 6000", `35.3<small>ms</small>`, "全部请求，含 HTTP 开销"]]
    : [["Layers used", `22.1<small>/ 32</small>`, "on average, JevBench public"], ["Accuracy", `86.1<small>%</small>`, "87.0% at full depth"], ["p50, RTX PRO 6000", `21.1<small>ms</small>`, "28.3 ms at full depth"], ["Mean, RTX PRO 6000", `35.3<small>ms</small>`, "all requests, HTTP included"]];
  const body = `<div class="row"><div class="card" style="flex:1.6"><h2>${zh ? "各出口单独作答的准确率 <span>· 经温度校准</span>" : "Accuracy of each exit <span>· temperature-calibrated</span>"}</h2>${lineLegend}${svgTag(W, H)}${g}</svg></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:20px">
        <div class="card" style="flex:none"><h2>${zh ? "自适应深度的终止层分布 <span>· 验证集</span>" : "Where adaptive answers <span>· our validation split</span>"}</h2><svg width="${SW}" height="96">${s}</svg></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px">${K.map(a => kp(...a)).join("")}</div></div></div>`;
  return frame(zh ? {
    title: "自适应深度：置信度达到阈值即终止计算",
    sub: "第 12、16、20、24 层各设一个 tuned-lens 出口，与最后一层读取相同的选项字母。请求在首个置信度达到阈值的出口处终止；否则沿用该层隐状态继续计算，无需重复计算前序各层。",
    body, src: "各出口准确率在合并 LoRA 之前的训练检查点上测得（与发布权重相差不超过 0.1）。延迟测量条件：单张 RTX PRO 6000，经 scripts/serve.py 串行发送请求，JevBench 公开题。",
  } : {
    title: "Adaptive depth: stop once the answer settles",
    sub: "Tuned-lens exits at layers 12, 16, 20 and 24 read the same option letters as the final layer. A request stops at the first confident exit; otherwise it carries on from there without recomputing earlier layers.",
    body, src: "Per-exit accuracy measured on the training checkpoint before the LoRA merge (the released weights differ by at most 0.1). Latency: one RTX PRO 6000, serial requests through scripts/serve.py, JevBench public tasks.",
  });
}

/* ---------- Latency on RTX PRO 6000 ---------- */
function latency() {
  const rows = [
    { name: zh ? "trutina-4b · 自适应深度" : "trutina-4b · adaptive", p50: T.latency_rtxpro6000.adaptive.p50, p95: T.latency_rtxpro6000.adaptive.p95, hw: "RTX PRO 6000", us: true, by: zh ? "本文" : "us" },
    { name: zh ? "trutina-4b · 完整深度" : "trutina-4b · full depth", p50: T.latency_rtxpro6000.full.p50, p95: T.latency_rtxpro6000.full.p95, hw: "RTX PRO 6000", us: true, by: zh ? "本文" : "us" },
    ...[["Cygnet", "Cygnet · 12B"], ["AutoJev-27B (RTX PRO 6000)", "AutoJev · 27B"], ["Surogate Rune 26B-A4B v3 (RTX PRO 6000)", "Surogate Rune · 26B-A4B"], ["swanOne", "swanOne"], ["Jev 1.13.0", zh ? "Jev 1.13.0 · 托管 API" : "Jev 1.13.0 · hosted API"]]
      .map(([n, label]) => { const r = pick(n); return { name: label, p50: r.p50_ms, p95: r.p95_ms, hw: r.hw === "api" ? (zh ? "端到端" : "end to end") : r.hw, by: "JevBench" }; }),
  ];
  const W = 1470, rowH = 64, top = 10, H = rows.length * rowH + top + 40, lx = 330;
  const x = logScale(10, 1000, lx, W - 150);
  let g = "";
  for (const t of [10, 20, 50, 100, 200, 500, 1000]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 34}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t} ms</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    g += `<text class="${r.us ? "lbl-us" : "lbl"}" x="${lx - 18}" y="${cy + 1}" text-anchor="end" ${r.us ? 'style="font-size:16px"' : ""}>${esc(r.name)}</text>`;
    g += `<text class="lbl-sub" x="${lx - 18}" y="${cy + 19}" text-anchor="end">${esc(r.hw)} · ${zh ? "测量方：" : "measured by "}${r.by}</text>`;
    g += `<line x1="${x(r.p50)}" x2="${x(r.p95)}" y1="${cy}" y2="${cy}" stroke="${r.us ? "var(--fg)" : "var(--faint)"}" stroke-width="2" stroke-dasharray="${r.us ? "" : "3 3"}"/>`;
    g += bar(lx, cy - 12, x(r.p50) - lx, 24, r.us ? "var(--fg)" : "var(--pale)");
    g += `<circle cx="${x(r.p95)}" cy="${cy}" r="5" fill="var(--card)" stroke="${r.us ? "var(--fg)" : "var(--faint)"}" stroke-width="2"/>`;
    g += `<text class="${r.us ? "val" : "val-muted"}" x="${x(r.p95) + 14}" y="${cy + 5}">${fmt1(r.p50)} <tspan class="lbl-sub">/ ${fmt1(r.p95)}</tspan></text>`;
  });
  const legend = `<div class="legend"><span><i><svg width="26" height="14"><rect width="26" height="14" rx="7" fill="var(--fg)"/></svg></i>p50</span>
    <span><i><svg width="26" height="14"><line x1="0" x2="20" y1="7" y2="7" stroke="var(--fg)" stroke-width="2"/><circle cx="20" cy="7" r="4.5" fill="#fff" stroke="var(--fg)" stroke-width="2"/></svg></i>p95</span></div>`;
  return frame(zh ? {
    title: "同一 GPU 上，速度接近最高准确率模型的两倍",
    sub: "RTX PRO 6000 上单次判断的延迟，串行发送请求。启用自适应深度时，trutina-4b 的中位延迟为 21 ms，约为该 GPU 上准确率最高的系统 Cygnet（39.8 ms）的一半。",
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: "其他系统为 JevBench v1.5.4 在其 RTX PRO 6000 节点上测得的原始延迟（450 道公开 standard 与 judge 题）；Jev 为托管 API 的端到端延迟。trutina-4b 在单张 RTX PRO 6000 上经自带 HTTP 服务自行测得，预热后运行 231 道 JevBench 公开题。两组测量的请求集不同，差异仅宜作数量级比较。",
  } : {
    title: "Nearly twice as fast as the best model on the same GPU",
    sub: "Per-decision latency on an RTX PRO 6000, one request at a time. With adaptive depth trutina-4b answers in 21 ms at the median, about half the 39.8 ms of Cygnet, the most accurate system measured on that GPU.",
    body: `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`,
    src: "Other systems: raw latency measured by JevBench v1.5.4 on its RTX PRO 6000 pod (450 open standard and judge items); Jev end to end through its hosted API. trutina-4b: measured by us on one RTX PRO 6000 through its own HTTP server, 231 public JevBench tasks after a warm-up. The request sets differ, so read the gap as an order of magnitude.",

/* ---------- Dumbbell helper (fine-tune, vision) ---------- */
function dumbbell(rows, lo, hi, labels) {
  const W = 1470, rowH = 80, top = 16, H = rows.length * rowH + top + 40, lx = 360;
  const x = linScale(lo, hi, lx, W - 140);
  let g = "";
  for (let t = lo; t <= hi; t += 10) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H - 34}" stroke="var(--grid)"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t}%</text>`;
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2, d = r.after - r.before;
    g += `<text class="lbl" x="${lx - 18}" y="${cy + (r.sub ? 1 : 6)}" text-anchor="end" style="font-size:16px; fill:var(--fg); font-weight:500">${esc(r.set)}</text>`;
    if (r.sub) g += `<text class="lbl-sub" x="${lx - 18}" y="${cy + 20}" text-anchor="end">${esc(r.sub)}</text>`;
    g += `<line x1="${x(r.before)}" x2="${x(r.after)}" y1="${cy}" y2="${cy}" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" opacity="${d > 0 ? 1 : .3}"/>`;
    g += `<circle cx="${x(r.before)}" cy="${cy}" r="8" fill="var(--card)" stroke="var(--faint)" stroke-width="2.5"/>`;
    g += usDot(x(r.after), cy, 9);
    g += `<text class="val" x="${Math.max(x(r.after), x(r.before)) + 22}" y="${cy + 6}">${fmt1(r.after)} <tspan class="lbl-sub" style="font-size:14px">${d >= 0 ? "+" : ""}${fmt1(d)} · ${labels.vs} ${fmt1(r.before)}</tspan></text>`;
  });
  const legend = `<div class="legend"><span><i><svg width="16" height="16"><circle cx="8" cy="8" r="6.5" fill="#fff" stroke="var(--faint)" stroke-width="2.5"/></svg></i>${labels.before}</span>
    <span><i><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--fg)"/></svg></i>trutina-4b</span></div>`;
  return `<div class="card">${legend}${svgTag(W, H)}${g}</svg></div>`;
}

function finetune() {
  const sub = { accuracy: zh ? "准确率" : "accuracy", "state-macro acc.": zh ? "按 state 宏平均的准确率" : "state-macro accuracy", "pair accuracy": zh ? "两种选项顺序均正确方计为正确" : "pair accuracy, both orders" };
  const name = { "JevBench public": zh ? "JevBench 公开集" : "JevBench public" };
  const rows = T.heldout.filter(r => r.set !== "DecisionBench hard").map(r => ({ set: name[r.set] || r.set, sub: sub[r.metric] || r.metric, before: r.zero_shot, after: r.trutina }));
  const body = dumbbell(rows, 40, 90, zh ? { before: "Qwen3.5-4B，相同 prompt，未微调", vs: "未微调" } : { before: "Qwen3.5-4B, same prompt, untrained", vs: "untrained" });
  return frame(zh ? {
    title: "微调在 held-out 基准上的增益",
    sub: "对照组使用相同骨干与相同 prompt。上述数据集既未用于训练，也未用于权重选择。fast-decisions 上准确率持平，但校准误差降低约一半（ECE 0.251 → 0.122）。",
    body, src: "全部结果均为自行测得。图中未列出 DecisionBench hard：该基准上 trutina-4b（49.6）低于未微调的骨干模型（53.6）。完整的 held-out 结果见模型卡片。",
  } : {
    title: "What the fine-tune adds on held-out benchmarks",
    sub: "Same backbone, same prompt. None of these sets was used for training or for choosing weights. fast-decisions accuracy is flat, but its calibration error halves (ECE 0.251 → 0.122).",
    body, src: "All numbers measured by us. Not shown: DecisionBench hard, where trutina-4b (49.6) is below the untrained backbone (53.6); every held-out result is in the model card.",
  });
}
